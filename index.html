<body>
<header><div class="top"><div class="brand"><div class="logo">📈</div><div><h1>لوحة السوق</h1><small>قراءة فنية فقط · القرار قرارك</small></div></div><button id="gear" aria-label="الإعدادات">⚙</button></div><div id="status"></div></header>

<main id="body"></main>

<script>
/* محرك التحليل الفني (JS) — نسخة طبق الأصل من analyst.py / indicators.py.
   كل الدوال نقية (بدون DOM). يُختبر مقابل Python بأرقام ذهبية (test_core.js). */
const Core = (function () {
  "use strict";
  const W = { trend: 25, momentum: 15, volume: 20, vwap: 7, ma_align: 12, breakout: 4, move: 10, risk: 10 };
  const CAPS = { below_vwap: 59, giveback: 0.6 };
  const CATS = [[80, "زخم شرائي قوي (Strong Bullish Momentum)"], [60, "زخم شرائي (Bullish Momentum)"],
    [40, "محايد / إشارات متضاربة (Neutral / Mixed)"], [20, "زخم بيعي (Bearish Momentum)"], [0, "زخم بيعي قوي (Strong Bearish Momentum)"]];
  const TFS = ["1Min", "3Min", "5Min", "15Min", "30Min", "1Hour", "1Day"];
  const MIN = { "1Min": 1, "3Min": 3, "5Min": 5, "15Min": 15, "30Min": 30, "1Hour": 60 };
  const DISC = "قراءة فنية فقط. القرار قرارك. ارتفاع الدرجة ليس ضمانًا لارتفاع السهم وليس توصية شراء أو بيع.";

  const clip = (x, a = -1, b = 1) => Math.max(a, Math.min(b, x));
  const sign = (x) => (x > 0 ? 1 : x < 0 ? -1 : 0);
  const isn = (x) => x === null || x === undefined || Number.isNaN(x);
  const last = (a, k = 1) => a[a.length - k];
  const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
  const category = (score) => CATS.find(([lim]) => score >= lim)[1];

  // ---------------------------------------------------------------- الوقت (نيويورك)
  const fmtNY = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  function nyParts(ms) {
    const p = {};
    for (const x of fmtNY.formatToParts(new Date(ms))) p[x.type] = x.value;
    return { d: `${p.year}-${p.month}-${p.day}`, m: parseInt(p.hour, 10) * 60 + parseInt(p.minute, 10) };
  }
  /** يحول شمعة Alpaca {t,o,h,l,c,v} إلى شكل التحليل. t نص RFC3339. */
  function toBar(x) {
    const ms = typeof x.t === "number" ? x.t : Date.parse(x.t);
    const q = nyParts(ms);
    return { t: ms, d: q.d, m: q.m, o: x.o, h: x.h, l: x.l, c: x.c, v: x.v };
  }
  /** شموع يومية: التاريخ بتوقيت نيويورك، m=0. */
  function toDaily(x) {
    const ms = Date.parse(x.t);
    const q = nyParts(ms);
    return { t: ms, d: q.d, m: 0, o: x.o, h: x.h, l: x.l, c: x.c, v: x.v };
  }

  // ---------------------------------------------------------------- المؤشرات (نفس pandas)
  function sma(a, n) {
    const out = a.map(() => NaN);
    for (let i = n - 1; i < a.length; i++) {
      let s = 0, ok = true;
      for (let j = i - n + 1; j <= i; j++) { if (isn(a[j])) { ok = false; break; } s += a[j]; }
      if (ok) out[i] = s / n;
    }
    return out;
  }
  function ewm(a, alpha, minp) {
    const out = a.map(() => NaN);
    let prev = NaN, cnt = 0;
    for (let i = 0; i < a.length; i++) {
      const x = a[i];
      if (isn(x)) { if (!isn(prev) && cnt >= minp) out[i] = prev; continue; }
      prev = isn(prev) ? x : alpha * x + (1 - alpha) * prev;
      cnt++;
      out[i] = cnt >= minp ? prev : NaN;
    }
    return out;
  }
  const ema = (a, n) => ewm(a, 2 / (n + 1), n);
  function rsi(c, n = 14) {
    const d = c.map((x, i) => (i === 0 ? NaN : x - c[i - 1]));
    const up = d.map((x) => (isn(x) ? NaN : Math.max(x, 0)));
    const dn = d.map((x) => (isn(x) ? NaN : Math.max(-x, 0)));
    const au = ewm(up, 1 / n, n), ad = ewm(dn, 1 / n, n);
    return au.map((u, i) => {
      if (isn(u)) return NaN;
      const dd = ad[i];
      if (dd === 0 && u > 0) return 100;
      if (dd === 0 && u === 0) return 50;
      return 100 - 100 / (1 + u / dd);
    });
  }
  function macd(c, fast = 12, slow = 26, sig = 9) {
    const ef = ema(c, fast), es = ema(c, slow);
    const line = ef.map((x, i) => x - es[i]);
    const signal = ewm(line, 2 / (sig + 1), sig);
    return { line, signal, hist: line.map((x, i) => x - signal[i]) };
  }
  function atr(bars, n = 14) {
    const tr = bars.map((b, i) => {
      let t = b.h - b.l;
      if (i > 0) t = Math.max(t, Math.abs(b.h - bars[i - 1].c), Math.abs(b.l - bars[i - 1].c));
      return t;
    });
    return ewm(tr, 1 / n, n);
  }
  function volumeRatio(bars, n = 20) {
    return bars.map((b, i) => {
      if (i < n) return NaN;
      let s = 0;
      for (let j = i - n; j < i; j++) s += bars[j].v;
      return b.v / (s / n);
    });
  }
  function rollingVwap(bars, n = 20) {
    return bars.map((_, i) => {
      if (i < n - 1) return NaN;
      let pv = 0, v = 0;
      for (let j = i - n + 1; j <= i; j++) { pv += ((bars[j].h + bars[j].l + bars[j].c) / 3) * bars[j].v; v += bars[j].v; }
      return pv / v;
    });
  }
  function sessionVwap(bars, intraday) {
    if (!intraday) return rollingVwap(bars, 20);
    let day = null, pv = 0, v = 0;
    return bars.map((b) => {
      if (b.d !== day) { day = b.d; pv = 0; v = 0; }
      pv += ((b.h + b.l + b.c) / 3) * b.v; v += b.v;
      return pv / v;
    });
  }
  function confirmedPivots(bars, k = 3) {
    const hi = [], lo = [];
    for (let i = k; i < bars.length - k; i++) {
      let mx = -Infinity, mn = Infinity;
      for (let j = i - k; j <= i + k; j++) { mx = Math.max(mx, bars[j].h); mn = Math.min(mn, bars[j].l); }
      if (bars[i].h === mx) hi.push([i, bars[i].h]);
      if (bars[i].l === mn) lo.push([i, bars[i].l]);
    }
    return { hi, lo };
  }
  function candlePattern(bars) {
    if (bars.length < 2) return [0, ""];
    const a = bars[bars.length - 2], b = bars[bars.length - 1];
    const body = Math.abs(b.c - b.o), rng = Math.max(b.h - b.l, 1e-9);
    const lower = Math.min(b.o, b.c) - b.l, upper = b.h - Math.max(b.o, b.c);
    if (a.c < a.o && b.c > b.o && b.c >= a.o && b.o <= a.c) return [1, "ابتلاعية صاعدة"];
    if (a.c > a.o && b.c < b.o && b.o >= a.c && b.c <= a.o) return [-1, "ابتلاعية هابطة"];
    if (lower >= 2 * body && upper <= 0.3 * rng && body / rng < 0.35 && b.c > b.o) return [1, "مطرقة"];
    if (upper >= 2 * body && lower <= 0.3 * rng && body / rng < 0.35 && b.c < b.o) return [-1, "نجمة السقوط"];
    return [0, ""];

      $$("#atfs button").forEach((b) => (b.onclick = () => { S.tf = b.dataset.tf; skey = ""; renderAnalysisBox(); }));
      skey = ""; return;
    }
    const sk = S.open + "|" + S.tf;
    if (skey !== sk || !$("#chart")) {
      box.innerHTML = `<div class="head" id="ahead"></div>
        <div id="cfs"><div class="ctool"><div class="seg" id="atfs">${C.TFS.map((t) => `<button data-tf="${t}" class="${t === S.tf ? "on" : ""}">${TF_LABEL[t]}</button>`).join("")}</div>
          <div class="seg" id="azoom"><button data-z="0.8" aria-label="تقريب">＋</button><button data-z="1.25" aria-label="إبعاد">－</button><button data-z="r" aria-label="إعادة">⟲</button></div>
          <div class="seg" id="amode"><button data-m="simple">بسيط</button><button data-m="adv">متقدم</button></div><button id="livebtn" class="livebtn" aria-label="الداشبورد المباشر"></button><button id="fsbtn" class="fsb">⛶ تكبير</button></div>
        <div class="ctool tgrow"><div class="tg" id="atg">${TGL.map(([k, t]) => `<button data-k="${k}">${t}</button>`).join("")}</div></div>
        <div class="fsrow"><div class="chartwrap"><canvas id="chart"></canvas><div id="pick" hidden></div></div><aside id="side"></aside></div></div>
        <p class="note tiphint">اضغط على أي خط أو علامة داخل الشارت ليظهر شرحها.</p>
        <div class="lbl">السعر مباشر</div><div id="lq"></div>
        <details class="more" id="more"><summary>تفاصيل أكثر (للمتقدمين)</summary><div class="legend"><span>R مقاومة</span><span>S دعم</span><span>INV مستوى إبطال القراءة</span><span>HOD/LOD أعلى/أدنى اليوم</span><span>PDH/PDL أعلى/أدنى أمس</span><span>PMH/PML ما قبل السوق</span><span>ORH/ORL النطاق الافتتاحي</span><span>▲▼ حدث فني مرقّم</span><span>الشمعة المتقطعة = حية، ولا تدخل في التحليل حتى تكتمل</span></div>
        <div class="sigs" id="asig"></div><div id="adyn"></div></details>`;
      { const cf = $("#cfeed"); if (cf) cf.innerHTML = candleFeed(S.open); const lq = $("#lq"); if (lq) lq.innerHTML = liveStrip(S.open); }
      CH = Chart.create($("#chart"), { show: modeShow(), onShow: (v) => { if (S.mode === "adv") Store.set("chartShow", v); }, onSignals: renderSigs, onPick: showPick, onFrame: renderSide });
      const syncMode = () => { $("#cfs").classList.toggle("adv", S.mode === "adv"); $$("#amode button").forEach((b) => b.classList.toggle("on", b.dataset.m === S.mode)); };
      syncMode(); $$("#amode button").forEach((b) => (b.onclick = () => { S.mode = b.dataset.m; Store.set("chartMode", S.mode); CH.setShow(modeShow()); syncMode(); sync(); renderSide(); }));
      $("#fsbtn").onclick = () => setFs(!S.fs); setFs(!!S.fs);
      liveBtn(); $("#livebtn").onclick = () => { if (S.liveMode) { loadSymbol(S.open, true).catch(() => {}); chartLive(); S.liveFlash = now(); } else { S.liveMode = true; Store.set("liveMode", true); liveBtn(); chartLive(); } };
      $("#livebtn").oncontextmenu = (e) => { e.preventDefault(); S.liveMode = !S.liveMode; Store.set("liveMode", S.liveMode); liveBtn(); };
      wsSync();
      const sync = () => $$("#atg button").forEach((b) => b.classList.toggle("on", !!CH.state.show[b.dataset.k]));
      sync();
      $$("#atg button").forEach((b) => (b.onclick = () => { CH.toggle(b.dataset.k); sync(); }));
      $$("#azoom button").forEach((b) => (b.onclick = () => (b.dataset.z === "r" ? CH.reset() : CH.zoom(parseFloat(b.dataset.z)))));
      $$("#atfs button").forEach((b) => (b.onclick = () => { S.tf = b.dataset.tf; skey = ""; renderAnalysisBox(); }));
      skey = sk; dynKey = "";
    }
    const lv = A.levels, dk = r ? `${r.last.t}|${r.score}|${A.bars1m.length}|${lv.HOD}|${lv.LOD}` : `limited|${frame.length}|${A.bars1m.length}`;
    if (dk !== dynKey) { dynKey = dk; if (r) fillDynamic(A, r); else fillLimited(A, frame); }
    chartLive();
  }
  /** شموع أقل من 30: نعرض الشارت فقط، بلا درجة ولا قراءة (لا نخترع تحليلًا من بيانات قليلة). */
  function fillLimited(A, frame) {
    lastR = null;
    const p = livePx(S.open), c = chgPct(S.open);
    $("#ahead").className = "head"; $("#ahead").innerHTML = `<div><b class="big2">${esc(S.open)}</b> <span id="hp" class="big2 ${cls(c)}">${num(p)}</span> <span id="hc" class="${cls(c)}">${pct(c)}</span></div><div id="ho" class="note">${offHoursHtml(S.open)}</div>`;
    $("#adyn").innerHTML = `<div class="warnbox"><b>⚠ بيانات قليلة: ${frame.length} شمعة مكتملة فقط في إطار ${esc(S.tf)}</b><p class="note" style="margin:6px 0">السهم قليل التداول على IEX (يظهر هذا في الوارنت والأسهم الضعيفة السيولة)، لذلك لا يمكن حساب الدرجة والقراءة (يلزم 30 شمعة مكتملة على الأقل). الشارت يعرض الشموع المتوفرة فقط. جرّب إطارًا أكبر مثل 15د أو يومي.</p></div>
      <p class="note">البيانات: <span id="fresh">${esc(freshText())}</span> · المصدر IEX · حجم جزئي</p><p class="note">${esc(C.DISC)}</p>`;
  }

  /** بطاقة "الصورة باختصار": اتجاه وحدود وحجم بلغة بسيطة. وصف فقط وليست توصية. */
  function liveM1(sym) {
    const A = S.analysis[sym]; if (!A) return [];
    const L = S.live[sym], q = L && C.nyParts(L.k * 60000);
    return L && !A.bars1m.some((b) => b.t === L.k * 60000) && q.m >= 570 && q.m <= 959 ? A.bars1m.concat([{ t: L.k * 60000, d: q.d, m: q.m, o: L.o, h: L.h, l: L.l, c: L.c, v: L.v, live: 1 }]) : A.bars1m;
  }
  /** شريط الشمعات المباشر: آخر شموع الدقيقة (الأحدث فوق) مع حجمها ونسبة الدخول المقدّرة. */
  function candleFeed(sym) {
    const m1 = liveM1(sym).filter((b) => C.isReg(b)); if (!m1.length) return '<p class="empty">لا توجد شموع بعد.</p>';
    const rows = m1.slice(-25).reverse().map((b, i, arr) => {
      const prev = i + 1 < arr.length ? arr[i + 1].c : b.o, ch = prev ? (b.c / prev - 1) * 100 : 0, r = b.h - b.l, buy = r > 0 ? (b.c - b.l) / r : b.c > b.o ? 1 : b.c < b.o ? 0 : 0.5;
      const tm = new Date(b.t).toLocaleTimeString("en-GB", { timeZone: "Asia/Riyadh", hour: "2-digit", minute: "2-digit" });
      return `<tr${b.live ? ' class="cur"' : ""}><td><bdi dir="ltr">${tm}</bdi>${b.live ? " ●" : ""}</td><td class="${b.c >= b.o ? "up" : "dn"}"><bdi dir="ltr">${num(b.c)}</bdi></td><td class="${cls(ch)}"><bdi dir="ltr">${pct(ch)}</bdi></td><td><bdi dir="ltr">${b.v.toLocaleString("en-US")}</bdi></td><td class="${buy >= 0.5 ? "up" : "dn"}"><bdi dir="ltr">${Math.round(buy * 100)}%</bdi></td></tr>`;
    }).join("");
    return `<div class="tw"><table><thead><tr><th>الوقت (الرياض)</th><th>الإغلاق</th><th>التغير</th><th>الحجم</th><th>الدخول</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note">● الشمعة الجارية. «الدخول» تقدير من موضع الإغلاق داخل الشمعة وليس أوامر حقيقية.</p>`;
  }
  function flowCard(sym) {
    const A = S.analysis[sym]; if (!A) return "";
    const m1 = liveM1(sym);
    const f = C.flow(m1); if (!f) return "";
    const K = (x) => { const a = Math.abs(x); return (x < 0 ? "-" : "") + (a >= 1e6 ? (a / 1e6).toFixed(2) + "M" : a >= 1e3 ? (a / 1e3).toFixed(1) + "K" : Math.round(a)); };
    const t = m1.filter((b) => b.d === f.day && C.isReg(b)), fs = C.flowSeries(t, false), n = t.length, k = Math.min(30, n - 1);
    const dP = k > 0 ? t[n - 1].c - t[n - 1 - k].c : 0, dF = k > 0 ? fs.cum[n - 1] - fs.cum[n - 1 - k] : 0;
    const tr = !k ? "" : dF > 0 && dP >= 0 ? "السعر والسيولة يصعدان معًا في آخر 30 دقيقة: الصعود مدعوم بدخول." : dF < 0 && dP <= 0 ? "السعر والسيولة ينزلان معًا في آخر 30 دقيقة: الهبوط مصحوب بخروج." : dF < 0 && dP > 0 ? "السعر يصعد لكن السيولة تنزل: الصعود بلا دعم واضح من الدخول." : dF > 0 && dP < 0 ? "السعر ينزل لكن السيولة تصعد: الهبوط يقابله دخول." : "";
    const st = { in: ["دخول أكثر من خروج", "up"], out: ["خروج أكثر من دخول", "dn"], flat: ["متوازن", "mid"] }[f.state];
    const l15 = f.last15 > 0 ? "دخول" : f.last15 < 0 ? "خروج" : "متوازن";
    return `<div class="simple" id="flowc"><div class="lbl">قراءة مؤشر السيولة (الخط الأزرق أسفل الشارت)</div><div class="trend ${st[1]}"><span class="tword">${esc(st[0])}</span><span class="tdesc">نسبة الدخول <bdi dir="ltr">${f.buyPct.toFixed(0)}%</bdi> من حجم اليوم</span>
      <ul class="sl"><li>دخول تقريبي: <bdi dir="ltr">${K(f.inV)}</bdi> سهم · خروج تقريبي: <bdi dir="ltr">${K(f.outV)}</bdi> سهم</li><li>الصافي: <bdi dir="ltr">${K(f.net)}</bdi> سهم · آخر 15 دقيقة: ${l15} (<bdi dir="ltr">${K(f.last15)}</bdi>)</li>${tr ? `<li>${esc(tr)}</li>` : ""}</ul>
      <div class="note">تقدير من الشموع وبيانات IEX الجزئية، وليس أوامر حقيقية. وصف لما حدث وليس توصية. القرار قرارك.</div></div></div>`;
  }
  function simpleCard(A, R, p, c) {
    const bars = A.frames[S.tf], n = bars.length, I = Chart.indicators(bars, S.tf !== "1Day"), T = Chart.trend(bars, I), F = R.facts;
    const st = T ? Chart.STATE[T.state] : ["غير واضح", "بيانات قليلة لرسم اتجاه"], k = T ? T.state : "unclear", col = k === "up" ? "up" : k === "down" ? "dn" : "mid", arrow = k === "up" ? "↗" : k === "down" ? "↘" : k === "side" ? "↔" : "•";
    const L = [];
    if (T) {
      const lo = T.L ? T.L.at(n - 1) : null, hi = T.H ? T.H.at(n - 1) : null;
      if (k === "side") { L.push(`فوق ${num(T.rangeHi)} يخرج السعر من النطاق للأعلى`); L.push(`تحت ${num(T.rangeLo)} يخرج من النطاق للأسفل`); }
      else if (k === "up" && lo !== null) { L.push(`الصعود يبقى سليمًا ما دام السعر فوق ${num(lo)}`); if (hi !== null) L.push(`السقف المائل الآن عند ${num(hi)}`); }
      else if (k === "down" && hi !== null) { L.push(`الهبوط يبقى سليمًا ما دام السعر تحت ${num(hi)}`); if (lo !== null) L.push(`الأرضية المائلة الآن عند ${num(lo)}`); }
      else if (lo !== null && hi !== null) { L.push(`النطاق الآن بين ${num(Math.min(lo, hi))} و${num(Math.max(lo, hi))}`); L.push("الخروج من أحد الطرفين بإغلاق شمعة يوضح الاتجاه"); }
      else L.push(`آخر 40 شمعة بين ${num(T.rangeLo)} و${num(T.rangeHi)}`);
    }
    const rv = F.rvol, vol = !rv ? "—" : rv >= 2 ? `أعلى بوضوح من المعتاد (${rv.toFixed(1)}×)` : rv >= 1.2 ? `أعلى قليلًا من المعتاد (${rv.toFixed(1)}×)` : rv < 0.7 ? `أقل من المعتاد (${rv.toFixed(1)}×)` : "عادي";
    const warn = [];
    if (!marketState().open) warn.push("السوق مغلق الآن، فالأرقام لآخر جلسة");
    if (p !== null && p < 1) warn.push("سهم تحت دولار: السعر يتحرك بسرعة والفرق بين سعر الشراء والبيع قد يأكل جزءًا من الحركة");
    else if (F.atr_pct && F.atr_pct > 2) warn.push(`التذبذب عالٍ: الشمعة الواحدة تتحرك نحو ${F.atr_pct.toFixed(1)}%`);
    return `<div class="simple"><div class="sh"><b class="big2">${esc(S.open)}</b> <span id="hp" class="big2 ${cls(c)}">${num(p)}</span> <span id="hc" class="${cls(c)}">${pct(c)}</span></div><div id="ho" class="note">${offHoursHtml(S.open)}</div>
      <div class="lbl">الاتجاه حسب آخر القمم والقيعان</div><div class="trend ${col}"><span class="tword">${arrow} ${esc(st[0])}</span><span class="tdesc">${esc(st[1])}</span></div>
      <ul class="sl">${L.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      <div class="mini">حجم التداول: <b>${esc(vol)}</b></div>
      <div class="mini">الدرجة الفنية: <b><bdi dir="ltr">${Math.round(R.score)}/100</bdi></b> على إطار ${esc(TF_LABEL[S.tf] || S.tf)}</div>
      ${warn.map((w) => `<div class="wn">⚠ ${esc(w)}</div>`).join("")}
      <div class="note">وصف لما يحدث في الشارت وليس توصية. القرار قرارك.</div></div>`;
  }
  function fillDynamic(A, r) {
    const meta = { fresh: freshText() };
    const R = C.report(S.open, A.results, S.tf, A.frames[S.tf], A.levels, meta); lastR = R;
    const F = R.facts, p = livePx(S.open), c = chgPct(S.open);
    const li = (a) => (a.length ? a.map((x) => `<li>${esc(x)}</li>`).join("") : "<li>—</li>");
    $("#ahead").className = "plain"; $("#ahead").innerHTML = simpleCard(A, R, p, c) + flowCard(S.open);
    $("#adyn").innerHTML = `<h3>الحقائق (من البيانات)</h3>
      <div class="grid">${[["RVOL", F.rvol ? F.rvol.toFixed(1) + "×" : "—"], ["RSI", F.rsi ? F.rsi.toFixed(0) : "—"], ["MACD", num(F.macd, 3)], ["إشارة", num(F.signal, 3)], ["هيستوغرام", num(F.hist, 3)], ["EMA9", num(F.ema9)], ["EMA20", num(F.ema20)], ["EMA50", num(F.ema50)], ["SMA200", num(F.sma200)], ["VWAP", num(F.vwap)], ["ATR", `${num(F.atr)} (${F.atr_pct ? F.atr_pct.toFixed(1) : "—"}%)`], ["شموع محللة", r.bars]].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>
      <div class="levels">${Object.entries(R.levels).filter(([k]) => R.levelNames[k]).map(([k, v]) => `<span class="chip">${R.levelNames[k]} ${num(v)}</span>`).join("")}</div>
      <h3>القراءة التفسيرية</h3><p class="read">${esc(R.reading)}</p>
      <div class="cols2"><div><h4>✅ إيجابي</h4><ul>${li(R.positives)}</ul></div><div><h4>❌ سلبي</h4><ul>${li(R.negatives)}</ul></div></div>
      ${R.conflicts.length ? `<div class="warnbox"><b>⚠ تعارض المؤشرات</b><ul>${li(R.conflicts)}</ul></div>` : ""}
      <h3>مقارنة الأطر الزمنية</h3><div class="mtf">${C.TFS.map((t) => { const x = A.results[t]; return `<div class="${x ? (x.score >= 60 ? "up" : x.score <= 40 ? "dn" : "mid") : "na"}"><b>${t}</b><span>${x ? Math.round(x.score) : "—"}</span></div>`; }).join("")}</div>
      <pre class="cmp">${esc(R.compare.text)}</pre>
      <h3>السيناريوهات</h3><p>🟢 <b>الإيجابي:</b> ${esc(R.scenarioUp)}</p><p>🔴 <b>السلبي:</b> ${esc(R.scenarioDown)}</p>
      <p class="inval">⛔ <b>مستوى إبطال القراءة:</b> ${esc(R.invalidation.text)}</p>
      ${R.risks.length ? `<div class="warnbox"><b>⚠ مخاطر</b><ul>${li(R.risks)}</ul></div>` : ""}
      <p class="note">البيانات: <span id="fresh">${esc(meta.fresh)}</span> · المصدر IEX · آخر شمعة مكتملة ${new Date(r.last.t).toLocaleString("ar-SA", { timeZone: "America/New_York" })} (نيويورك)</p>
      <p class="note">${esc(R.disclaimer)}</p>`;
  }
  function alertsUI(el) {
    const mine = S.alerts;
    el.innerHTML = `<div class="bar"><button id="aclr">مسح الكل</button><label class="inl"><input type="checkbox" id="asound" ${S.cfgAlerts.sound ? "checked" : ""}> اهتزاز</label></div>` +
      (mine.length ? mine.map((a) => { const s = staleness(a); return `<div class="alert ${s.stale ? "stale" : ""}"><div><b>${symLink(a.sym)}</b> ${num(a.price)} · ${a.tf} · <span class="chip">${esc(a.indicator)}</span></div><div>${esc(a.why)}</div>
        <div class="note">${new Date(a.time).toLocaleTimeString("ar-SA", { timeZone: "America/New_York" })} (نيويورك) · عمرها ${fmtAge(s.age)}${s.moved !== null ? ` · السعر الآن ${num(lastPrice(a.sym))} (${pct(s.moved)} منذ الإشارة)` : ""}${s.stale ? ' · <b class="warnt">⚠ قديمة: أعد القراءة قبل أي قرار</b>' : ""}</div></div>`; }).join("") : '<p class="empty">لا توجد تنبيهات بعد. تُرسل عند تحول الحالة فقط (لا تكرار).</p>');
    $("#aclr").onclick = () => { S.alerts = []; render(); };
    $("#asound").onchange = (e) => { S.cfgAlerts.sound = e.target.checked; Store.set("cfgAlerts", S.cfgAlerts); };
    bindOpen();
  }
  function renderLive() {
    renderStatus();
    if (S.tab === "watch") renderWatchList();
    else if (S.tab === "analysis") renderAnalysisBox();
    else if (S.tab === "overview") overviewUI($("#body"));
    else if (S.tab === "alerts") alertsUI($("#body"));
  }
  function render() { renderTabs(); renderStatus(); renderBody(); }

  // ---------------------------------------------------------------- الإعدادات
  function settings() {
    const d = $("#settings");
    d.innerHTML = `<div class="sheet"><h3>الإعدادات</h3>
      <p class="warnt">استخدم مفاتيح بيانات أو حساب تجريبي (Paper) فقط. المفاتيح تُحفظ في هذا الجهاز ولا تُرسل لأي جهة إلا Alpaca.</p>
      <label>Alpaca Key ID<input id="sk" value="${esc(S.key)}" autocomplete="off"></label><label>Alpaca Secret<input id="ss" type="password" value="${esc(S.secret)}" autocomplete="off"></label>
      <label>موضوع ntfy (اختياري: يرسل تنبيهات الصفحة لجوالك)<input id="sn" value="${esc(S.ntfy)}"></label>
      <label>Finnhub Key (اختياري: للقيمة السوقية)<input id="sf" value="${esc(S.finnhub)}"></label>
      <div class="bar"><button id="ssave">حفظ</button><button id="sclose">إغلاق</button></div></div>`;
    d.hidden = false;
    $("#sclose").onclick = () => (d.hidden = true);
    $("#ssave").onclick = () => { S.key = $("#sk").value.trim(); S.secret = $("#ss").value.trim(); S.ntfy = $("#sn").value.trim(); S.finnhub = $("#sf").value.trim(); ["key", "secret", "ntfy", "finnhub"].forEach((k) => Store.set(k, S[k])); d.hidden = true; start(); };
  }
  function start() { render(); if (S.key && S.secret) { wsDelay = 1000; wsConnect(); S.watch.forEach((s) => loadSymbol(s).catch(() => {})); } }
  function init() {
    $("#gear").onclick = settings;
    setInterval(() => { renderStatus(); if (S.tab === "alerts") alertsUI($("#body")); if (S.tab === "analysis") updateHead(); }, 3000);
    setInterval(wsSync, 5000);
    let lt = 0; setInterval(() => liveTick(lt++), 1000);
    setInterval(() => { const lq = $("#lq"); if (lq && S.open && S.tab === "analysis") lq.innerHTML = liveStrip(S.open); }, 1000);
    start();
  }
  window.FT = { get CH() { return CH; }, offHours, S, API, init, detectAlerts, staleness, passFilters, mergeBars, pushAlert, buyPressure, liveTick, liveBtn, candleFeed, onQuote, liveStrip, formingBar, onTrade };
  window.FT.surge3 = surge3;
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

</script>
