<style>

input,select,button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--acc)}

.chip{display:inline-block;background:#1d2d3f;border-radius:10px;padding:1px 9px;margin:2px;font-size:12px}.chip.warn{background:#4a2a20;color:#ffb199}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.grid div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between}.grid span{color:var(--mut)}

.cmp{white-space:pre-wrap;font:inherit;color:var(--mut)}.inval{background:#2a1d1d;border:1px solid #5b2b2b;border-radius:8px;padding:8px 12px}

<body>
<header><div class="top"><h1>📊 لوحة تحليل الأسهم الأمريكية — قراءة فقط، القرار قرارك</h1><button id="gear" aria-label="الإعدادات">⚙</button></div><div id="status"></div></header>
<nav id="tabs"></nav>
<main id="body"></main>
<div id="settings" hidden></div>
<script>
/* محرك التحليل الفني (JS) — نسخة طبق الأصل من analyst.py / indicators.py.
   كل الدوال نقية (بدون DOM). يُختبر مقابل Python بأرقام ذهبية (test_core.js). */
const Core = (function () {
  "use strict";
  const W = { trend: 20, momentum: 15, volume: 15, vwap: 10, ma_align: 10, breakout: 10, move: 10, risk: 10 };
  const CAPS = { below_vwap: 59, giveback: 0.6 };
  const CATS = [[80, "زخم شرائي قوي (Strong Bullish Momentum)"], [60, "زخم شرائي (Bullish Momentum)"],
    [40, "محايد / إشارات متضاربة (Neutral / Mixed)"], [20, "زخم بيعي (Bearish Momentum)"], [0, "زخم بيعي قوي (Strong Bearish Momentum)"]];
  const TFS = ["1Min", "3Min", "5Min", "15Min", "30Min", "1Hour", "1Day"];
  const MIN = { "1Min": 1, "3Min": 3, "5Min": 5, "15Min": 15, "30Min": 30, "1Hour": 60 };
  const DISC = "قراءة فنية فقط. القرار قرارك. ارتفاع الدرجة ليس ضمانًا لارتفاع السهم وليس توصية شراء أو بيع.";

  const clip = (x, a = -1, b = 1) => Math.max(a, Math.min(b, x));
  const sign = (x) => (x > 0 ? 1 : x < 0 ? -1 : 0);
  const isn = (x) => x === null || x === undefined || Number.isNaN(x);
  const last = (a, k = 1) => a[a.length - k];
  const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
  const category = (score) => CATS.find(([lim]) => score >= lim)[1];

  // ---------------------------------------------------------------- الوقت (نيويورك)
  const fmtNY = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  function nyParts(ms) {
    const p = {};
    for (const x of fmtNY.formatToParts(new Date(ms))) p[x.type] = x.value;
    return { d: `${p.year}-${p.month}-${p.day}`, m: parseInt(p.hour, 10) * 60 + parseInt(p.minute, 10) };
  }
  /** يحول شمعة Alpaca {t,o,h,l,c,v} إلى شكل التحليل. t نص RFC3339. */
  function toBar(x) {
    const ms = typeof x.t === "number" ? x.t : Date.parse(x.t);
    const q = nyParts(ms);
    return { t: ms, d: q.d, m: q.m, o: x.o, h: x.h, l: x.l, c: x.c, v: x.v };
  }
  /** شموع يومية: التاريخ بتوقيت نيويورك، m=0. */
  function toDaily(x) {
    const ms = Date.parse(x.t);
    const q = nyParts(ms);
    return { t: ms, d: q.d, m: 0, o: x.o, h: x.h, l: x.l, c: x.c, v: x.v };
  }

  // ---------------------------------------------------------------- المؤشرات (نفس pandas)
  function sma(a, n) {
    const out = a.map(() => NaN);
    for (let i = n - 1; i < a.length; i++) {
      let s = 0, ok = true;
      for (let j = i - n + 1; j <= i; j++) { if (isn(a[j])) { ok = false; break; } s += a[j]; }
      if (ok) out[i] = s / n;
    }
    return out;
  }
  function ewm(a, alpha, minp) {
    const out = a.map(() => NaN);
    let prev = NaN, cnt = 0;
    for (let i = 0; i < a.length; i++) {
      const x = a[i];
      if (isn(x)) { if (!isn(prev) && cnt >= minp) out[i] = prev; continue; }
      prev = isn(prev) ? x : alpha * x + (1 - alpha) * prev;
      cnt++;
      out[i] = cnt >= minp ? prev : NaN;
    }
    return out;
  }
  const ema = (a, n) => ewm(a, 2 / (n + 1), n);
  function rsi(c, n = 14) {
    const d = c.map((x, i) => (i === 0 ? NaN : x - c[i - 1]));
    const up = d.map((x) => (isn(x) ? NaN : Math.max(x, 0)));
    const dn = d.map((x) => (isn(x) ? NaN : Math.max(-x, 0)));
    const au = ewm(up, 1 / n, n), ad = ewm(dn, 1 / n, n);
    return au.map((u, i) => {
      if (isn(u)) return NaN;
      const dd = ad[i];
      if (dd === 0 && u > 0) return 100;
      if (dd === 0 && u === 0) return 50;
      return 100 - 100 / (1 + u / dd);
    });
  }
  function macd(c, fast = 12, slow = 26, sig = 9) {
    const ef = ema(c, fast), es = ema(c, slow);
    const line = ef.map((x, i) => x - es[i]);
    const signal = ewm(line, 2 / (sig + 1), sig);
    return { line, signal, hist: line.map((x, i) => x - signal[i]) };
  }
  function atr(bars, n = 14) {
    const tr = bars.map((b, i) => {
      let t = b.h - b.l;
      if (i > 0) t = Math.max(t, Math.abs(b.h - bars[i - 1].c), Math.abs(b.l - bars[i - 1].c));
      return t;
    });
    return ewm(tr, 1 / n, n);
  }
  function volumeRatio(bars, n = 20) {
    return bars.map((b, i) => {
      if (i < n) return NaN;
      let s = 0;
      for (let j = i - n; j < i; j++) s += bars[j].v;
      return b.v / (s / n);
    });
  }
  function rollingVwap(bars, n = 20) {
    return bars.map((_, i) => {
      if (i < n - 1) return NaN;
      let pv = 0, v = 0;
      for (let j = i - n + 1; j <= i; j++) { pv += ((bars[j].h + bars[j].l + bars[j].c) / 3) * bars[j].v; v += bars[j].v; }
      return pv / v;
    });
  }
  function sessionVwap(bars, intraday) {
    if (!intraday) return rollingVwap(bars, 20);
    let day = null, pv = 0, v = 0;
    return bars.map((b) => {
      if (b.d !== day) { day = b.d; pv = 0; v = 0; }
      pv += ((b.h + b.l + b.c) / 3) * b.v; v += b.v;
      return pv / v;
    });
  }
  function confirmedPivots(bars, k = 3) {
    const hi = [], lo = [];
    for (let i = k; i < bars.length - k; i++) {
      let mx = -Infinity, mn = Infinity;
      for (let j = i - k; j <= i + k; j++) { mx = Math.max(mx, bars[j].h); mn = Math.min(mn, bars[j].l); }
      if (bars[i].h === mx) hi.push([i, bars[i].h]);
      if (bars[i].l === mn) lo.push([i, bars[i].l]);
    }
    return { hi, lo };
  }
  function candlePattern(bars) {
    if (bars.length < 2) return [0, ""];
    const a = bars[bars.length - 2], b = bars[bars.length - 1];
    const body = Math.abs(b.c - b.o), rng = Math.max(b.h - b.l, 1e-9);
    const lower = Math.min(b.o, b.c) - b.l, upper = b.h - Math.max(b.o, b.c);
    if (a.c < a.o && b.c > b.o && b.c >= a.o && b.o <= a.c) return [1, "ابتلاعية صاعدة"];
    if (a.c > a.o && b.c < b.o && b.o >= a.c && b.c <= a.o) return [-1, "ابتلاعية هابطة"];
    if (lower >= 2 * body && upper <= 0.3 * rng && body / rng < 0.35 && b.c > b.o) return [1, "مطرقة"];
    if (upper >= 2 * body && lower <= 0.3 * rng && body / rng < 0.35 && b.c < b.o) return [-1, "نجمة السقوط"];
    return [0, ""];
  }
  function divergence(bars, r, k = 3, within = 40) {
    const { hi, lo } = confirmedPivots(bars, k), n = bars.length;
    const L = lo.filter(([i]) => n - i <= within), H = hi.filter(([i]) => n - i <= within);
    if (L.length >= 2 && L[L.length - 1][1] < L[L.length - 2][1] && r[L[L.length - 1][0]] > r[L[L.length - 2][0]]) return "bull";
    if (H.length >= 2 && H[H.length - 1][1] > H[H.length - 2][1] && r[H[H.length - 1][0]] < r[H[H.length - 2][0]]) return "bear";
    return null;
  }
  const fx = (x, d = 2) => (isn(x) ? "—" : Number(x).toFixed(d));

  function events(bars, e20, e50, r) {
    const ev = [];
    const n = bars.length;
    if (n < 25) return ev;
    const c = bars.map((b) => b.c), h = bars.map((b) => b.h), l = bars.map((b) => b.l);
    const res = Math.max(...h.slice(n - 22, n - 2)), sup = Math.min(...l.slice(n - 22, n - 2));
    if (c[n - 1] > res && res >= c[n - 2]) ev.push(["breakout", 1, `اختراق مقاومة ${fx(res)}`]);
    if (c[n - 1] < sup && sup <= c[n - 2]) ev.push(["breakdown", -1, `كسر دعم ${fx(sup)}`]);
    if (c[n - 2] > res && c[n - 1] < res && c[n - 3] <= res) ev.push(["false_up", -1, `اختراق كاذب لمقاومة ${fx(res)} (عاد تحتها)`]);
    if (c[n - 2] < sup && c[n - 1] > sup && c[n - 3] >= sup) ev.push(["false_down", 1, `كسر كاذب لدعم ${fx(sup)} (عاد فوقه)`]);
    const up = last(e20) > last(e50);
    if (up && Math.min(l[n - 2], l[n - 1]) <= last(e20) * 1.003 && c[n - 1] > last(e20) && last(r) >= 40 && last(r) <= 62)
      ev.push(["pullback", 1, "ارتداد (Pullback) على EMA20 داخل اتجاه صاعد"]);
    const [p, name] = candlePattern(bars);
    if (p) {
      const nearLow = l[n - 1] <= Math.min(...l.slice(n - 20)) * 1.01;
      const nearHigh = h[n - 1] >= Math.max(...h.slice(n - 20)) * 0.99;
      if (p > 0 && nearLow) ev.push(["rev_bull", 1, `انعكاس صاعد (${name}) عند قاع قريب`]);
      else if (p < 0 && nearHigh) ev.push(["rev_bear", -1, `انعكاس هابط (${name}) عند قمة قريبة`]);
      else ev.push(["candle", p, `شمعة ${name}`]);
    }
    return ev;
  }

  const giveback = (price, lv) => {
    const hod = lv && lv.HOD, lod = lv && lv.LOD;
    if (isn(hod) || isn(lod) || hod <= lod) return null;
    return (hod - price) / (hod - lod);
  };

  /** يحلل إطارًا واحدًا (شموع مكتملة). intraday=true للأطر القصيرة. */
  function analyzeTF(bars, tf, opts = {}) {
    const { rvol = null, lv = null, intraday = tf !== "1Day" } = opts;
    if (!bars || bars.length < 30) return null;
    const c = bars.map((b) => b.c), n = c.length;
    const price = c[n - 1];
    const e9 = ema(c, 9), e20 = ema(c, 20), e50 = ema(c, 50), s200 = sma(c, 200);
    const r = rsi(c);
    const m = macd(c);
    const a = atr(bars);
    const vw = sessionVwap(bars, intraday);
    const f = (s) => (isn(last(s)) ? null : last(s));
    const F = { price, ema9: f(e9), ema20: f(e20), ema50: f(e50), sma200: f(s200), rsi: f(r), macd: f(m.line), signal: f(m.signal),
      hist: f(m.hist), hist_prev: isn(last(m.hist, 2)) ? null : last(m.hist, 2), atr: f(a), vwap: f(vw) };
    F.atr_pct = F.atr ? (F.atr / price) * 100 : null;
    if (rvol !== null && rvol !== undefined) F.rvol = rvol;
    else if (n > 21) { const x = last(volumeRatio(bars)); F.rvol = isn(x) ? null : x; } else F.rvol = null;
    F.div = F.rsi !== null ? divergence(bars, r) : null;
    const ev = events(bars, e20, e50, r);
    const sc = {};
    const parts = ["ema20", "ema50", "sma200"].filter((k) => F[k] !== null).map((k) => sign(price - F[k]));
    const e20v = e20.filter((x) => !isn(x));
    const slope = e20v.length > 6 ? (e20[n - 1] - e20[n - 6]) / e20[n - 6] : 0;
    sc.trend = clip(mean(parts) * 0.7 + clip(slope / 0.02) * 0.3);
    if (F.rsi !== null && F.hist !== null) {
      const d = sign(F.hist) * 0.6 + (F.hist_prev !== null ? sign(F.hist - F.hist_prev) * 0.4 : 0);
      sc.momentum = clip(0.5 * clip((F.rsi - 50) / 25) + 0.5 * d);
    } else sc.momentum = 0;
    const chg5 = n > 6 ? price / c[n - 6] - 1 : 0;
    const rv = F.rvol || 0;
    sc.volume = rv >= 1 ? clip(sign(chg5) * clip((rv - 1) / 2, 0, 1)) : 0;
    sc.vwap = F.vwap && F.atr ? clip((price - F.vwap) / F.atr) : 0;
    const pairs = [[F.ema9, F.ema20], [F.ema20, F.ema50], [F.ema9, F.ema50]].filter(([x, y]) => x !== null && y !== null);
    sc.ma_align = clip(mean(pairs.map(([x, y]) => sign(x - y))));
    sc.breakout = ev.length ? clip(ev.filter((e) => e[0] !== "candle").reduce((s, e) => s + e[1], 0) * 0.7 + ev.filter((e) => e[0] === "candle").reduce((s, e) => s + e[1], 0) * 0.3) : 0;
    sc.move = n > 6 ? clip((price / c[n - 6] - 1) / (F.atr_pct ? F.atr_pct / 100 : 0.02) / 3) : 0;
    let risk = 0;
    if (F.atr_pct !== null) risk = F.atr_pct < 2 ? 0.1 : F.atr_pct < 5 ? 0.3 : F.atr_pct < 10 ? 0.6 : 0.9;
    risk = Math.min(1, risk + (rv && rv < 0.5 ? 0.1 : 0) + (price < 1 ? 0.1 : 0));
    const dirKeys = Object.keys(W).filter((k) => k !== "risk");
    const raw = dirKeys.reduce((s, k) => s + W[k] * sc[k], 0) / dirKeys.reduce((s, k) => s + W[k], 0);
    let score = 50 + 50 * raw * (1 - (W.risk / 100) * risk);
    const capped = [];
    const gb = intraday ? giveback(price, lv) : null;
    F.giveback = gb;
    if (intraday && F.vwap && price < F.vwap && score > CAPS.below_vwap) { score = CAPS.below_vwap; capped.push("السعر تحت VWAP"); }
    if (gb !== null && gb >= CAPS.giveback && score > CAPS.below_vwap) { score = CAPS.below_vwap; capped.push(`تراجع ${(gb * 100).toFixed(0)}% من نطاق اليوم`); }
    score = Math.round(score * 10) / 10;
    return { tf, facts: F, factors: sc, risk, score, category: category(score), events: ev, bars: n, last: bars[n - 1], capped };
  }

  // ---------------------------------------------------------------- الدقيقة → الأطر
  const REG0 = 570, REG1 = 959;
  const isReg = (b) => b.m >= REG0 && b.m <= REG1;
  function resample(bars1m, tf) {
    const reg = bars1m.filter(isReg);
    if (tf === "1Min") return reg;
    const N = MIN[tf], out = [];
    let cur = null;
    for (const b of reg) {
      const bucket = REG0 + Math.floor((b.m - REG0) / N) * N;
      const key = b.d + "|" + bucket;
      if (!cur || cur.key !== key) {
        cur = { key, t: b.t - (b.m - bucket) * 60000, d: b.d, m: bucket, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v };
        out.push(cur);
      } else { cur.h = Math.max(cur.h, b.h); cur.l = Math.min(cur.l, b.l); cur.c = b.c; cur.v += b.v; }
    }
    return out.map(({ key, ...x }) => x);
  }
  /** يحذف الشمعة الأخيرة إن لم تكتمل (بدايتها + مدتها > الآن). */
  function completed(bars, minutes, nowMs) {

  async function scanUniverse() {

    } else if (t === "breakout") {
      const br = rows.filter((r) => r.near && (r.near.dist <= 1.5 || r.events.some((e) => e[0] === "breakout"))).sort((a, b) => (a.near.dist) - (b.near.dist));
      out.innerHTML = table([...COLS.base, ["المقاومة", (r) => num(r.near.res)], ["المسافة", (r) => pct(r.near.dist)], ["حدث", (r) => r.events.filter((e) => ["breakout", "false_up", "breakdown"].includes(e[0])).map((e) => esc(e[2])).join("<br>") || "قريب من الاختراق"], ...COLS.vol, ...COLS.risk], br, "لا أسهم قريبة من اختراق ضمن الفلاتر.")
        + '<p class="note">القرب من الاختراق ليس إشارة نجاح: بعض الاختراقات تكون كاذبة. راجع الحجم وتأكيد الإغلاق.</p>';
    }
    bindOpen();
  }

  function overviewUI(el) {
    const idx = ["SPY", "QQQ", "IWM"], mk = marketState();
    el.innerHTML = `<div class="cards">${idx.map((s) => {
      const A = S.analysis[s], r = A && A.results["5Min"], c = chgPct(s);
      return `<div class="card" data-open="${s}"><b>${s}</b><div class="big ${cls(c)}">${num(lastPrice(s))}</div><div class="${cls(c)}">${pct(c)}</div><div>${r ? scoreBadge(r.score, r.category) + " " + esc(r.category.split(" (")[0]) : "جارٍ التحميل…"}</div></div>`;
    }).join("")}</div><div class="card wide"><b>حالة السوق الأمريكي</b><div>${mk.label} · توقيت نيويورك ${new Date(now()).toLocaleTimeString("en-US", { timeZone: "America/New_York" })}</div></div>
      <p class="note">${esc(C.DISC)}</p>`;
    idx.forEach((s) => { if (!S.bars1m[s]) loadSymbol(s).catch(() => {}); });
    bindOpen();
  }
  function watchUI(el) {
    el.innerHTML = `<div class="bar"><input id="wadd" placeholder="رمز سهم، مثال: ONFO" maxlength="6" autocapitalize="characters"><button id="wbtn">إضافة</button></div><div id="wlist"></div>`;
    $("#wbtn").onclick = () => { const s = $("#wadd").value.trim().toUpperCase(); if (SYM_RE.test(s) && !S.watch.includes(s) && S.watch.length < 30) { S.watch.push(s); Store.set("watch", S.watch); wsSync(); loadSymbol(s).catch(() => {}); render(); } };
    renderWatchList();
  }
  function renderWatchList() {
    const el = $("#wlist"); if (!el) return;
    const rows = S.watch.map((s) => { const A = S.analysis[s], r = A && A.results["5Min"]; return { sym: s, price: lastPrice(s), chg: chgPct(s), score: r ? r.score : null, cat: r ? r.category : null, rvol: r ? r.facts.rvol : null, n: S.alerts.filter((a) => a.sym === s).length }; });
    el.innerHTML = table([...COLS.base, ["الدرجة", (r) => scoreBadge(r.score, r.cat)], ["RVOL", (r) => (r.rvol ? r.rvol.toFixed(1) + "×" : "—")], ["تنبيهات", (r) => r.n || ""], ["", (r) => `<a class="rm" data-rm="${r.sym}">حذف</a>`]], rows, "القائمة فارغة.");
    $$("[data-rm]").forEach((a) => (a.onclick = () => { S.watch = S.watch.filter((x) => x !== a.dataset.rm); Store.set("watch", S.watch); wsSync(); render(); }));
    bindOpen();
  }
  function analysisUI(el) {
    el.innerHTML = `<div class="bar"><input id="asym" placeholder="رمز السهم" value="${esc(S.open || "")}" maxlength="6" autocapitalize="characters"><button id="ago">تحليل</button>
      <select id="atf">${C.TFS.map((t) => `<option ${t === S.tf ? "selected" : ""}>${t}</option>`).join("")}</select><button id="aadd">+ قائمتي</button></div><div id="abox"><p class="empty">اكتب رمز سهم واضغط تحليل.</p></div>`;
    $("#ago").onclick = () => { const s = $("#asym").value.trim().toUpperCase(); if (SYM_RE.test(s)) { S.open = s; S.tf = $("#atf").value; wsSync(); loadAnalysis(true); } };
    $("#atf").onchange = () => { S.tf = $("#atf").value; renderAnalysisBox(); };
    $("#aadd").onclick = () => { const s = S.open; if (s && !S.watch.includes(s) && S.watch.length < 30) { S.watch.push(s); Store.set("watch", S.watch); wsSync(); $("#aadd").textContent = "تمت الإضافة"; } };
    if (S.open) renderAnalysisBox();
  }
  async function loadAnalysis(force) {
    if (!S.open) return;
    const box = $("#abox"); if (box) box.innerHTML = '<p class="empty">جارٍ تحميل البيانات…</p>';
    try { await loadSymbol(S.open, force); } catch (e) { if (box) box.innerHTML = `<p class="empty">تعذر جلب البيانات: ${esc(e.message)}</p>`; return; }
    renderAnalysisBox();
  }
  function renderAnalysisBox() {
    const box = $("#abox"); if (!box || !S.open) return;
    const A = S.analysis[S.open];
    if (!A) { box.innerHTML = '<p class="empty">لا توجد بيانات كافية.</p>'; return; }
    const r = A.results[S.tf];
    if (!r) { box.innerHTML = `<p class="empty">بيانات غير كافية لإطار ${S.tf} (يلزم 30 شمعة مكتملة على الأقل). جرّب إطارًا آخر.</p>`; return; }
    const m1 = A.bars1m, last = m1.length ? m1[m1.length - 1].t : null;
    const age = last ? (now() - last) / 1000 : null, open = marketState().open;
    const meta = { fresh: age === null ? "لا بيانات" : open ? (age < 150 ? `لحظية (IEX) — آخر شمعة قبل ${fmtAge(age)}` : `⚠ متأخرة — آخر شمعة قبل ${fmtAge(age)}`) : `السوق مغلق — آخر شمعة قبل ${fmtAge(age)}` };
    const R = C.report(S.open, A.results, S.tf, A.frames[S.tf], A.levels, meta);
    const F = R.facts, p = lastPrice(S.open), c = chgPct(S.open);
    const li = (a) => (a.length ? a.map((x) => `<li>${esc(x)}</li>`).join("") : "<li>—</li>");
    box.innerHTML = `<div class="head"><div><b class="big2">${esc(S.open)}</b> <span class="big2 ${cls(c)}">${num(p)}</span> <span class="${cls(c)}">${pct(c)}</span></div>
      <div class="gauge"><div class="gfill ${R.score >= 60 ? "up" : R.score <= 40 ? "dn" : "mid"}" style="width:${R.score}%"></div></div>
      <div><b>${Math.round(R.score)}/100</b> — ${esc(R.category)} <span class="note">(على إطار ${esc(S.tf)} فقط)</span></div></div>
      <canvas id="chart"></canvas>
      <h3>الحقائق (من البيانات)</h3>
      <div class="grid">${[["RVOL", F.rvol ? F.rvol.toFixed(1) + "×" : "—"], ["RSI", F.rsi ? F.rsi.toFixed(0) : "—"], ["MACD", num(F.macd, 3)], ["إشارة", num(F.signal, 3)], ["هيستوغرام", num(F.hist, 3)], ["EMA9", num(F.ema9)], ["EMA20", num(F.ema20)], ["EMA50", num(F.ema50)], ["SMA200", num(F.sma200)], ["VWAP", num(F.vwap)], ["ATR", `${num(F.atr)} (${F.atr_pct ? F.atr_pct.toFixed(1) : "—"}%)`], ["شموع محللة", r.bars]].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>
      <div class="levels">${Object.entries(R.levels).filter(([k]) => R.levelNames[k]).map(([k, v]) => `<span class="chip">${R.levelNames[k]} ${num(v)}</span>`).join("")}</div>
      <h3>القراءة التفسيرية</h3><p class="read">${esc(R.reading)}</p>
      <div class="cols2"><div><h4>✅ إيجابي</h4><ul>${li(R.positives)}</ul></div><div><h4>❌ سلبي</h4><ul>${li(R.negatives)}</ul></div></div>
      ${R.conflicts.length ? `<div class="warnbox"><b>⚠ تعارض المؤشرات</b><ul>${li(R.conflicts)}</ul></div>` : ""}
      <h3>مقارنة الأطر الزمنية</h3><div class="mtf">${C.TFS.map((t) => { const x = A.results[t]; return `<div class="${x ? (x.score >= 60 ? "up" : x.score <= 40 ? "dn" : "mid") : "na"}"><b>${t}</b><span>${x ? Math.round(x.score) : "—"}</span></div>`; }).join("")}</div>
      <pre class="cmp">${esc(R.compare.text)}</pre>
      <h3>السيناريوهات</h3><p>🟢 <b>الإيجابي:</b> ${esc(R.scenarioUp)}</p><p>🔴 <b>السلبي:</b> ${esc(R.scenarioDown)}</p>
      <p class="inval">⛔ <b>مستوى إبطال القراءة:</b> ${esc(R.invalidation.text)}</p>
      ${R.risks.length ? `<div class="warnbox"><b>⚠ مخاطر</b><ul>${li(R.risks)}</ul></div>` : ""}
      <p class="note">البيانات: ${esc(meta.fresh)} · المصدر IEX · آخر شمعة مكتملة ${new Date(r.last.t).toLocaleString("ar-SA", { timeZone: "America/New_York" })} (نيويورك)</p>
      <p class="note">${esc(R.disclaimer)}</p>`;
    drawChart($("#chart"), A.frames[S.tf], A, S.tf);
  }
  function alertsUI(el) {
    const mine = S.alerts;
    el.innerHTML = `<div class="bar"><button id="aclr">مسح الكل</button><label class="inl"><input type="checkbox" id="asound" ${S.cfgAlerts.sound ? "checked" : ""}> اهتزاز</label></div>` +
      (mine.length ? mine.map((a) => { const s = staleness(a); return `<div class="alert ${s.stale ? "stale" : ""}"><div><b>${symLink(a.sym)}</b> ${num(a.price)} · ${a.tf} · <span class="chip">${esc(a.indicator)}</span></div><div>${esc(a.why)}</div>
        <div class="note">${new Date(a.time).toLocaleTimeString("ar-SA", { timeZone: "America/New_York" })} (نيويورك) · عمرها ${fmtAge(s.age)}${s.moved !== null ? ` · السعر الآن ${num(lastPrice(a.sym))} (${pct(s.moved)} منذ الإشارة)` : ""}${s.stale ? ' · <b class="warnt">⚠ قديمة: أعد القراءة قبل أي قرار</b>' : ""}</div></div>`; }).join("") : '<p class="empty">لا توجد تنبيهات بعد. تُرسل عند تحول الحالة فقط (لا تكرار).</p>');
    $("#aclr").onclick = () => { S.alerts = []; render(); };
    $("#asound").onchange = (e) => { S.cfgAlerts.sound = e.target.checked; Store.set("cfgAlerts", S.cfgAlerts); };
    bindOpen();
  }
  function renderLive() {
    renderStatus();
    if (S.tab === "watch") renderWatchList();
    else if (S.tab === "analysis") renderAnalysisBox();
    else if (S.tab === "overview") overviewUI($("#body"));
    else if (S.tab === "alerts") alertsUI($("#body"));
  }
  function render() { renderTabs(); renderStatus(); renderBody(); }

  // ---------------------------------------------------------------- الإعدادات
  function settings() {
    const d = $("#settings");
    d.innerHTML = `<div class="sheet"><h3>الإعدادات</h3>
      <p class="warnt">استخدم مفاتيح بيانات أو حساب تجريبي (Paper) فقط. المفاتيح تُحفظ في هذا الجهاز ولا تُرسل لأي جهة إلا Alpaca.</p>
      <label>Alpaca Key ID<input id="sk" value="${esc(S.key)}" autocomplete="off"></label><label>Alpaca Secret<input id="ss" type="password" value="${esc(S.secret)}" autocomplete="off"></label>
      <label>موضوع ntfy (اختياري: يرسل تنبيهات الصفحة لجوالك)<input id="sn" value="${esc(S.ntfy)}"></label>
      <label>Finnhub Key (اختياري: للقيمة السوقية)<input id="sf" value="${esc(S.finnhub)}"></label>
      <div class="bar"><button id="ssave">حفظ</button><button id="sclose">إغلاق</button></div></div>`;
    d.hidden = false;
    $("#sclose").onclick = () => (d.hidden = true);
    $("#ssave").onclick = () => { S.key = $("#sk").value.trim(); S.secret = $("#ss").value.trim(); S.ntfy = $("#sn").value.trim(); S.finnhub = $("#sf").value.trim(); ["key", "secret", "ntfy", "finnhub"].forEach((k) => Store.set(k, S[k])); d.hidden = true; start(); };
  }
  function start() { render(); if (S.key && S.secret) { wsDelay = 1000; wsConnect(); S.watch.forEach((s) => loadSymbol(s).catch(() => {})); } }
  function init() {
    $("#gear").onclick = settings;
    setInterval(() => { renderStatus(); if (S.tab === "alerts") alertsUI($("#body")); }, 5000);
    setInterval(wsSync, 5000);
    start();
  }
  window.FT = { S, API, init, detectAlerts, staleness, passFilters, mergeBars, pushAlert };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

</script>
</body>
</html>
