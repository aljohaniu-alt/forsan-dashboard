<body>
<header><div class="top"><div class="brand"><div class="logo">📈</div><div><h1>لوحة السوق</h1><small>قراءة فنية فقط · القرار قرارك</small></div></div><button id="gear" aria-label="الإعدادات">⚙</button></div><div id="status"></div></header>

<script>
/* محرك التحليل الفني (JS) — نسخة طبق الأصل من analyst.py / indicators.py.
   كل الدوال نقية (بدون DOM). يُختبر مقابل Python بأرقام ذهبية (test_core.js). */
const Core = (function () {
  "use strict";
  const W = { trend: 20, momentum: 15, volume: 15, vwap: 10, ma_align: 10, breakout: 10, move: 10, risk: 10 };
  const CAPS = { below_vwap: 59, giveback: 0.6 };
  const CATS = [[80, "زخم شرائي قوي (Strong Bullish Momentum)"], [60, "زخم شرائي (Bullish Momentum)"],
    [40, "محايد / إشارات متضاربة (Neutral / Mixed)"], [20, "زخم بيعي (Bearish Momentum)"], [0, "زخم بيعي قوي (Strong Bearish Momentum)"]];
  const TFS = ["1Min", "3Min", "5Min", "15Min", "30Min", "1Hour", "1Day"];
  const MIN = { "1Min": 1, "3Min": 3, "5Min": 5, "15Min": 15, "30Min": 30, "1Hour": 60 };
  const DISC = "قراءة فنية فقط. القرار قرارك. ارتفاع الدرجة ليس ضمانًا لارتفاع السهم وليس توصية شراء أو بيع.";

  const clip = (x, a = -1, b = 1) => Math.max(a, Math.min(b, x));
  const sign = (x) => (x > 0 ? 1 : x < 0 ? -1 : 0);
  const isn = (x) => x === null || x === undefined || Number.isNaN(x);
  const last = (a, k = 1) => a[a.length - k];
  const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
  const category = (score) => CATS.find(([lim]) => score >= lim)[1];

  // ---------------------------------------------------------------- الوقت (نيويورك)
  const fmtNY = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  function nyParts(ms) {
    const p = {};
    for (const x of fmtNY.formatToParts(new Date(ms))) p[x.type] = x.value;
    return { d: `${p.year}-${p.month}-${p.day}`, m: parseInt(p.hour, 10) * 60 + parseInt(p.minute, 10) };
  }
  /** يحول شمعة Alpaca {t,o,h,l,c,v} إلى شكل التحليل. t نص RFC3339. */
  function toBar(x) {
    const ms = typeof x.t === "number" ? x.t : Date.parse(x.t);
    const q = nyParts(ms);
    return { t: ms, d: q.d, m: q.m, o: x.o, h: x.h, l: x.l, c: x.c, v: x.v };
  }
  /** شموع يومية: التاريخ بتوقيت نيويورك، m=0. */
  function toDaily(x) {
    const ms = Date.parse(x.t);
    const q = nyParts(ms);
    return { t: ms, d: q.d, m: 0, o: x.o, h: x.h, l: x.l, c: x.c, v: x.v };
  }

  // ---------------------------------------------------------------- المؤشرات (نفس pandas)
  function sma(a, n) {
    const out = a.map(() => NaN);
    for (let i = n - 1; i < a.length; i++) {
      let s = 0, ok = true;
      for (let j = i - n + 1; j <= i; j++) { if (isn(a[j])) { ok = false; break; } s += a[j]; }
      if (ok) out[i] = s / n;
    }
    return out;
  }
  function ewm(a, alpha, minp) {
    const out = a.map(() => NaN);
    let prev = NaN, cnt = 0;
    for (let i = 0; i < a.length; i++) {
      const x = a[i];
      if (isn(x)) { if (!isn(prev) && cnt >= minp) out[i] = prev; continue; }
      prev = isn(prev) ? x : alpha * x + (1 - alpha) * prev;
      cnt++;
      out[i] = cnt >= minp ? prev : NaN;
    }
    return out;
  }
  const ema = (a, n) => ewm(a, 2 / (n + 1), n);
  function rsi(c, n = 14) {
    const d = c.map((x, i) => (i === 0 ? NaN : x - c[i - 1]));
    const up = d.map((x) => (isn(x) ? NaN : Math.max(x, 0)));
    const dn = d.map((x) => (isn(x) ? NaN : Math.max(-x, 0)));
    const au = ewm(up, 1 / n, n), ad = ewm(dn, 1 / n, n);
    return au.map((u, i) => {
      if (isn(u)) return NaN;
      const dd = ad[i];
      if (dd === 0 && u > 0) return 100;
      if (dd === 0 && u === 0) return 50;
      return 100 - 100 / (1 + u / dd);
    });
  }
  function macd(c, fast = 12, slow = 26, sig = 9) {
    const ef = ema(c, fast), es = ema(c, slow);
    const line = ef.map((x, i) => x - es[i]);
    const signal = ewm(line, 2 / (sig + 1), sig);
    return { line, signal, hist: line.map((x, i) => x - signal[i]) };
  }
  function atr(bars, n = 14) {
    const tr = bars.map((b, i) => {
      let t = b.h - b.l;
      if (i > 0) t = Math.max(t, Math.abs(b.h - bars[i - 1].c), Math.abs(b.l - bars[i - 1].c));
      return t;
    });
    return ewm(tr, 1 / n, n);
  }
  function volumeRatio(bars, n = 20) {
    return bars.map((b, i) => {
      if (i < n) return NaN;
      let s = 0;
      for (let j = i - n; j < i; j++) s += bars[j].v;
      return b.v / (s / n);
    });
  }
  function rollingVwap(bars, n = 20) {
    return bars.map((_, i) => {
      if (i < n - 1) return NaN;
      let pv = 0, v = 0;
      for (let j = i - n + 1; j <= i; j++) { pv += ((bars[j].h + bars[j].l + bars[j].c) / 3) * bars[j].v; v += bars[j].v; }
      return pv / v;
    });
  }
  function sessionVwap(bars, intraday) {
    if (!intraday) return rollingVwap(bars, 20);
    let day = null, pv = 0, v = 0;
    return bars.map((b) => {
      if (b.d !== day) { day = b.d; pv = 0; v = 0; }
      pv += ((b.h + b.l + b.c) / 3) * b.v; v += b.v;
      return pv / v;
    });
  }
  function confirmedPivots(bars, k = 3) {
    const hi = [], lo = [];
    for (let i = k; i < bars.length - k; i++) {
      let mx = -Infinity, mn = Infinity;
      for (let j = i - k; j <= i + k; j++) { mx = Math.max(mx, bars[j].h); mn = Math.min(mn, bars[j].l); }
      if (bars[i].h === mx) hi.push([i, bars[i].h]);
      if (bars[i].l === mn) lo.push([i, bars[i].l]);
    }
    return { hi, lo };
  }
  function candlePattern(bars) {
    if (bars.length < 2) return [0, ""];
    const a = bars[bars.length - 2], b = bars[bars.length - 1];
    const body = Math.abs(b.c - b.o), rng = Math.max(b.h - b.l, 1e-9);
    const lower = Math.min(b.o, b.c) - b.l, upper = b.h - Math.max(b.o, b.c);
    if (a.c < a.o && b.c > b.o && b.c >= a.o && b.o <= a.c) return [1, "ابتلاعية صاعدة"];
    if (a.c > a.o && b.c < b.o && b.o >= a.c && b.c <= a.o) return [-1, "ابتلاعية هابطة"];
    if (lower >= 2 * body && upper <= 0.3 * rng && body / rng < 0.35 && b.c > b.o) return [1, "مطرقة"];
    if (upper >= 2 * body && lower <= 0.3 * rng && body / rng < 0.35 && b.c < b.o) return [-1, "نجمة السقوط"];
    return [0, ""];
  }
  function divergence(bars, r, k = 3, within = 40) {
    const { hi, lo } = confirmedPivots(bars, k), n = bars.length;
    const L = lo.filter(([i]) => n - i <= within), H = hi.filter(([i]) => n - i <= within);
    if (L.length >= 2 && L[L.length - 1][1] < L[L.length - 2][1] && r[L[L.length - 1][0]] > r[L[L.length - 2][0]]) return "bull";
    if (H.length >= 2 && H[H.length - 1][1] > H[H.length - 2][1] && r[H[H.length - 1][0]] < r[H[H.length - 2][0]]) return "bear";
    return null;
  }
  const fx = (x, d = 2) => (isn(x) ? "—" : Number(x).toFixed(d));

  function events(bars, e20, e50, r) {
    const ev = [];
    const n = bars.length;
    if (n < 25) return ev;
    const c = bars.map((b) => b.c), h = bars.map((b) => b.h), l = bars.map((b) => b.l);
    const res = Math.max(...h.slice(n - 22, n - 2)), sup = Math.min(...l.slice(n - 22, n - 2));
    if (c[n - 1] > res && res >= c[n - 2]) ev.push(["breakout", 1, `اختراق مقاومة ${fx(res)}`]);
    if (c[n - 1] < sup && sup <= c[n - 2]) ev.push(["breakdown", -1, `كسر دعم ${fx(sup)}`]);
    if (c[n - 2] > res && c[n - 1] < res && c[n - 3] <= res) ev.push(["false_up", -1, `اختراق كاذب لمقاومة ${fx(res)} (عاد تحتها)`]);
    if (c[n - 2] < sup && c[n - 1] > sup && c[n - 3] >= sup) ev.push(["false_down", 1, `كسر كاذب لدعم ${fx(sup)} (عاد فوقه)`]);
    const up = last(e20) > last(e50);
    if (up && Math.min(l[n - 2], l[n - 1]) <= last(e20) * 1.003 && c[n - 1] > last(e20) && last(r) >= 40 && last(r) <= 62)
      ev.push(["pullback", 1, "ارتداد (Pullback) على EMA20 داخل اتجاه صاعد"]);
    const [p, name] = candlePattern(bars);
    if (p) {

  }

  const giveback = (price, lv) => {
    const hod = lv && lv.HOD, lod = lv && lv.LOD;
    if (isn(hod) || isn(lod) || hod <= lod) return null;
    return (hod - price) / (hod - lod);
  };

  /** يحلل إطارًا واحدًا (شموع مكتملة). intraday=true للأطر القصيرة. */
  function analyzeTF(bars, tf, opts = {}) {
    const { rvol = null, lv = null, intraday = tf !== "1Day" } = opts;
    if (!bars || bars.length < 30) return null;
    const c = bars.map((b) => b.c), n = c.length;
    const price = c[n - 1];
    const e9 = ema(c, 9), e20 = ema(c, 20), e50 = ema(c, 50), s200 = sma(c, 200);
    const r = rsi(c);
    const m = macd(c);
    const a = atr(bars);
    const vw = sessionVwap(bars, intraday);
    const f = (s) => (isn(last(s)) ? null : last(s));

      hist: f(m.hist), hist_prev: isn(last(m.hist, 2)) ? null : last(m.hist, 2), atr: f(a), vwap: f(vw) };

    if (rvol !== null && rvol !== undefined) F.rvol = rvol;
    else if (n > 21) { const x = last(volumeRatio(bars)); F.rvol = isn(x) ? null : x; } else F.rvol = null;
    F.div = F.rsi !== null ? divergence(bars, r) : null;
    const ev = events(bars, e20, e50, r);
    const sc = {};
    const parts = ["ema20", "ema50", "sma200"].filter((k) => F[k] !== null).map((k) => sign(price - F[k]));
    const e20v = e20.filter((x) => !isn(x));
    const slope = e20v.length > 6 ? (e20[n - 1] - e20[n - 6]) / e20[n - 6] : 0;
    sc.trend = clip(mean(parts) * 0.7 + clip(slope / 0.02) * 0.3);

    sc.move = n > 6 ? clip((price / c[n - 6] - 1) / (F.atr_pct ? F.atr_pct / 100 : 0.02) / 3) : 0;

    const raw = dirKeys.reduce((s, k) => s + W[k] * sc[k], 0) / dirKeys.reduce((s, k) => s + W[k], 0);

    if (gb !== null && gb >= CAPS.giveback && score > CAPS.below_vwap) { score = CAPS.below_vwap; capped.push(`تراجع ${(gb * 100).toFixed(0)}% من نطاق اليوم`); }
    score = Math.round(score * 10) / 10;
    return { tf, facts: F, factors: sc, risk, score, category: category(score), events: ev, bars: n, last: bars[n - 1], capped };
  }

  // ---------------------------------------------------------------- الدقيقة → الأطر
  const REG0 = 570, REG1 = 959;
  const isReg = (b) => b.m >= REG0 && b.m <= REG1;
  function resample(bars1m, tf) {
    const reg = bars1m.filter(isReg);
    if (tf === "1Min") return reg;
    const N = MIN[tf], out = [];
    let cur = null;
    for (const b of reg) {
      const bucket = REG0 + Math.floor((b.m - REG0) / N) * N;
      const key = b.d + "|" + bucket;
      if (!cur || cur.key !== key) {
        cur = { key, t: b.t - (b.m - bucket) * 60000, d: b.d, m: bucket, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v };
        out.push(cur);
      } else { cur.h = Math.max(cur.h, b.h); cur.l = Math.min(cur.l, b.l); cur.c = b.c; cur.v += b.v; }

    return out.map(({ key, ...x }) => x);
  }
  /** يحذف الشمعة الأخيرة إن لم تكتمل (بدايتها + مدتها > الآن). */
  function completed(bars, minutes, nowMs) {
    if (!bars.length) return bars;
    return last(bars).t + minutes * 60000 > nowMs ? bars.slice(0, -1) : bars;
  }
  function levels(bars1m) {
    const out = {};
    if (!bars1m.length) return out;
    const days = [...new Set(bars1m.map((b) => b.d))].sort();
    const today = last(days);
    const t = bars1m.filter((b) => b.d === today);
    const reg = t.filter(isReg), pm = t.filter((b) => b.m >= 240 && b.m < REG0);
    const mx = (a) => Math.max(...a.map((b) => b.h)), mn = (a) => Math.min(...a.map((b) => b.l));

      const orr = reg.filter((b) => b.m <= 584);
      if (orr.length) { out.OR_high = mx(orr); out.OR_low = mn(orr); }
    }
    if (pm.length) { out.PM_high = mx(pm); out.PM_low = mn(pm); }
    if (days.length > 1) {
      const pr = bars1m.filter((b) => b.d === days[days.length - 2] && isReg(b));
      if (pr.length) { out.PDH = mx(pr); out.PDL = mn(pr); }
    }
    return out;
  }
  function todRvol(bars1m, lookback = 10) {
    const reg = bars1m.filter(isReg);
    if (!reg.length) return null;
    const days = [...new Set(reg.map((b) => b.d))].sort();
    const today = reg.filter((b) => b.d === last(days));
    const tEnd = last(today).m;
    const cur = today.reduce((s, b) => s + b.v, 0);
    const prev = [];
    for (const d of days.slice(Math.max(0, days.length - 1 - lookback), days.length - 1)) {

  // ---------------------------------------------------------------- مقارنة الأطر والتقرير
  function compare(results) {
    const side = (s) => (s >= 60 ? "صاعد" : s <= 40 ? "هابط" : "محايد");
    const order = TFS.filter((t) => results[t]);
    const sides = {};
    order.forEach((t) => (sides[t] = side(results[t].score)));
    const L = ["الأطر: " + order.map((t) => `${t}: ${sides[t]} (${results[t].score.toFixed(0)})`).join(" | ")];
    const missing = TFS.filter((t) => !results[t]);
    const ups = order.filter((t) => sides[t] === "صاعد"), dns = order.filter((t) => sides[t] === "هابط");
    if (ups.length && dns.length) L.push(`⚠ تعارض: صاعد على ${ups.join(", ")} وهابط على ${dns.join(", ")}. لا توجد قراءة موحدة.`);
    else if (ups.length >= Math.max(3, order.length - 1)) L.push("توافق صاعد على أغلب الأطر.");
    else if (dns.length >= Math.max(3, order.length - 1)) L.push("توافق هابط على أغلب الأطر.");
    else L.push("لا يوجد توافق واضح بين الأطر.");

  }
  function rsiWord(x) { return x > 70 ? "تشبع شراء" : x > 50 ? "زخم إيجابي" : x > 30 ? "ضعيف" : "تشبع بيع"; }

      if (F[k] !== null) (p > F[k] ? pos : neg).push(`السعر ${p > F[k] ? "فوق" : "تحت"} ${nm} (${fx(F[k])})`);
    });
    if (F.vwap) (p > F.vwap ? pos : neg).push(`السعر ${p > F.vwap ? "فوق" : "تحت"} VWAP (${fx(F.vwap)})`);
    if (F.hist !== null) (F.hist > 0 ? pos : neg).push(`MACD ${F.hist > 0 ? "إيجابي" : "سلبي"} و${F.hist > (F.hist_prev || 0) ? "يتحسن" : "يضعف"}`);
    if (F.rsi !== null) {
      if (F.rsi > 70) neg.push(`RSI ${F.rsi.toFixed(0)}: تشبع شراء، احتمال تباطؤ أو تصحيح`);
      else if (F.rsi < 30) pos.push(`RSI ${F.rsi.toFixed(0)}: تشبع بيع، احتمال ارتداد`);
      else if (F.rsi > 50) pos.push(`RSI ${F.rsi.toFixed(0)}: زخم إيجابي`);
      else neg.push(`RSI ${F.rsi.toFixed(0)}: زخم ضعيف`);
    }
    if (F.div === "bull") pos.push("انفراج إيجابي (Divergence): السعر قاع أدنى وRSI قاع أعلى");
    if (F.div === "bear") neg.push("انفراج سلبي (Divergence): السعر قمة أعلى وRSI قمة أدنى");
    if (F.rvol !== null && F.rvol !== undefined) {

      else if (F.rvol < 0.7) neg.push(`حجم ضعيف (${F.rvol.toFixed(1)}× المعتاد)`);
    }
    r.events.forEach(([, s, t]) => (s > 0 ? pos : neg).push(t));
    if (F.giveback !== null && F.giveback !== undefined && F.giveback >= 0.5) neg.push(`تراجع ${(F.giveback * 100).toFixed(0)}% من نطاق اليوم (بعيد عن أعلى اليوم)`);
    if (F.vwap && F.hist !== null && (p > F.vwap) !== (F.hist > 0)) conf.push("السعر وVWAP يتجهان عكس MACD");
    if (F.rsi !== null && F.rsi > 70 && sc.trend > 0.3) conf.push("اتجاه صاعد لكن RSI في تشبع شراء");
    if (F.rsi !== null && F.rsi < 30 && sc.trend < -0.3) conf.push("اتجاه هابط لكن RSI في تشبع بيع (احتمال ارتداد مؤقت)");
    if (F.rvol !== null && F.rvol !== undefined && F.rvol < 0.7 && Math.abs(sc.move) > 0.4) conf.push("حركة سعرية قوية بحجم ضعيف: أقل موثوقية");
    const bits = [];
    if (F.vwap) bits.push(`السهم يتداول ${p > F.vwap ? "أعلى" : "أسفل"} VWAP`);
    if (F.ema9) bits.push(`${p > F.ema9 ? "أعلى" : "أسفل"} EMA9`);
    if (F.rvol >= 1.5) bits.push("مع ارتفاع في الحجم النسبي");
    if (F.hist !== null) bits.push(F.hist > 0 ? "MACD إيجابي" : "MACD سلبي");
    let txt = bits.join("، ") + ". ";
    const cat = r.category.split(" (")[0].replace(" قوي", "");
    const concl = cat === "زخم شرائي" ? "هذه المعطيات تشير إلى تحسن الزخم الشرائي" : cat === "زخم بيعي" ? "هذه المعطيات تشير إلى ضغط بيعي" : "المعطيات متضاربة ولا تعطي اتجاهًا واضحًا";
    txt += concl;
    if (r.capped && r.capped.length) { txt = txt.replace("هذه المعطيات تشير إلى تحسن الزخم الشرائي", "المؤشرات المتأخرة صاعدة"); txt += `، لكن الدرجة خُفّضت لأن: ${r.capped.join("، ")}`; }
    else if (conf.length) txt += "، لكن " + conf[0];
    txt += ". المهم مراقبة ثبات السعر مقابل VWAP وEMA20 ومدى استمرار الحجم.";
    return { pos, neg, conf, txt };
  }
  function invalidation(r, bars) {
    const F = r.facts, atrv = F.atr || 0, { hi, lo } = confirmedPivots(bars, 3);
    if (r.score >= 50) {

      return { px: base - 0.1 * atrv, text: `تحت ${fx(base - 0.1 * atrv)} (آخر قاع مؤكد)` };
    }
    const base = hi.length ? last(hi)[1] : Math.max(...bars.slice(-10).map((b) => b.h));
    return { px: base + 0.1 * atrv, text: `فوق ${fx(base + 0.1 * atrv)} (آخر قمة مؤكدة)` };
  }
  const LV_NAMES = { HOD: "أعلى اليوم", LOD: "أدنى اليوم", PDH: "أعلى أمس", PDL: "أدنى أمس", PM_high: "أعلى ما قبل السوق", PM_low: "أدنى ما قبل السوق", OR_high: "أعلى النطاق الافتتاحي", OR_low: "أدنى النطاق الافتتاحي" };

    if (F.atr_pct && F.atr_pct > 8) risks.push("تذبذب مرتفع جدًا: الأوقاف الضيقة تُضرب بسهولة");
    if (F.rvol !== null && F.rvol !== undefined && F.rvol < 0.7) risks.push("سيولة ضعيفة اليوم");
    if (F.rvol !== null && F.rvol !== undefined && F.rvol > 50) risks.push("RVOL مبالغ فيه لأن حجم الأيام السابقة شبه معدوم: لا تعتمد على الرقم نفسه");
    return {
      sym, tf: baseTf, score: r.score, category: r.category, capped: r.capped,
      facts: F, levels: lv, levelNames: LV_NAMES, reading: txt, positives: it.pos, negatives: it.neg, conflicts: it.conf,
      compare: cmp, invalidation: inv, risks, meta,
      scenarioUp: `ثبات فوق VWAP/EMA20 وتجاوز ${fx(up)} بحجم مرتفع يدعم استمرار الزخم.`,

<script>

      st.hits.forEach((h) => { if (h.k !== "lv") return; const dd = Math.abs(h.y - py); if (dd <= 8 && dd < bd) { bd = dd; best = h; } });

        const i = idxAt(px_), { I } = st.cache, d = st.d, all = d.forming ? d.bars.concat([d.forming]) : d.bars;
        const arrs = [["EMA9", I.e9], ["EMA20", I.e20], ["EMA50", I.e50], ["VWAP", d.intraday ? I.vw : []], ["SMA200", d.intraday ? [] : I.s200]];

      ptrs.set(ev.pointerId, rectX(ev));

    });
    canvas.addEventListener("pointermove", (ev) => {
      if (!ptrs.has(ev.pointerId)) { if (ev.pointerType === "mouse" && st.geom) { const p = rectX(ev); st.cross = { i: idxAt(p.x), y: p.y }; schedule(); } return; }
      ptrs.set(ev.pointerId, rectX(ev));
      if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()]; st.n = Math.round(pinch.n0 * pinch.d0 / (Math.hypot(a.x - b.x, a.y - b.y) || 1)); schedule(); return; }
      if (drag && st.geom) {
        const p = rectX(ev), dx = p.x - drag.x0;

      }

    const up = (ev) => {
      const had = ptrs.delete(ev.pointerId);

    canvas.addEventListener("pointerleave", (ev) => { if (ev.pointerType === "mouse") { st.cross = null; schedule(); } });

    return {
      setData, draw: schedule, state: st, snapshot, hitTest, pick, clearPick() { st.sel = null; schedule(); },
      zoom(f) { st.n = Math.round(st.n * f); schedule(); },
      reset() { st.off = 0; st.n = st.d && st.d.tf === "1Day" ? 120 : 80; st.cross = null; schedule(); },
      toggle(k) { st.show[k] = !st.show[k]; if (opts.onShow) opts.onShow(st.show); schedule(); },

<script>
/* لوحة تحليل الأسهم الأمريكية — اتصال مباشر من المتصفح بـ Alpaca (REST + WebSocket). بدون وسيط = أقل تأخير.

(function () {
  "use strict";

    key: Store.get("key", ""), secret: Store.get("secret", ""), ntfy: Store.get("ntfy", ""), finnhub: Store.get("finnhub", ""),
    watch: Store.get("watch", ["SPY", "QQQ", "IWM"]),
    filters: Store.get("filters", { minPrice: 0.3, maxPrice: 20, minPct: 0, minRvol: 0, minVol: 0, minAvgVol: 0, minDollar: 0, minAtr: 0, maxAtr: 100, minCap: 0 }),
    cfgAlerts: Store.get("cfgAlerts", { sound: false, rsiLow: 30, rsiHigh: 70, rvolSpike: 3, volSurge: 5 }),
    bars1m: {}, daily: {}, trade: {}, live: {}, snap: {}, mcap: {}, alerts: [], seen: {}, prev: {}, analysis: {},
    ws: { state: "off", ticks: 0, lastMsg: 0, lastTrade: 0, lag: null }, rtt: null, skew: 0, tab: "overview", open: null, tf: "5Min",
  };
  const now = () => Date.now() + S.skew;

  // ---------------------------------------------------------------- واجهة Alpaca
  const API = {
    host: "https://data.alpaca.markets",
    headers() { return { "APCA-API-KEY-ID": S.key, "APCA-API-SECRET-KEY": S.secret }; },
    async get(path, params = {}) {
      const u = new URL(this.host + path);
      Object.entries(params).forEach(([k, v]) => v !== undefined && v !== null && u.searchParams.set(k, v));
      const t0 = performance.now();
      const r = await fetch(u.toString(), { headers: this.headers() });
      S.rtt = Math.round(performance.now() - t0);
      const d = r.headers.get("Date");
      if (d) S.skew = Date.parse(d) - Date.now();
      if (!r.ok) throw new Error(`HTTP ${r.status}` + (r.status === 401 || r.status === 403 ? " (المفاتيح غير صحيحة)" : r.status === 429 ? " (تجاوز حد الطلبات)" : ""));

    },
    async bars(symbols, tf, start, extra = {}) {

      let tok = null;

        const j = await this.get("/v2/stocks/bars", { symbols: symbols.join(","), timeframe: tf, start, feed: "iex", adjustment: "split", limit: 10000, sort: "asc", page_token: tok, ...extra });

    },
    async snapshots(symbols) {
      const out = {};

        const j = await this.get("/v2/stocks/snapshots", { symbols: symbols.slice(i, i + 200).join(","), feed: "iex" });
        Object.assign(out, j.snapshots || j);
      }
      return out;
    },
    movers: (top = 50) => API.get("/v1beta1/screener/stocks/movers", { top }),
    actives: (top = 50) => API.get("/v1beta1/screener/stocks/most-actives", { by: "volume", top }),
  };
  const isoDaysAgo = (d) => new Date(now() - d * 86400000).toISOString();

  // ---------------------------------------------------------------- بيانات الأسهم
  function mergeBars(arr, nb) {
    const m = new Map(arr.map((b) => [b.t, b]));

    return [...m.values()].sort((a, b) => a.t - b.t);
  }
  const mergeRaw = (a, b) => { const m = new Map(a.map((x) => [x.t, x])); b.forEach((x) => m.set(x.t, x)); return [...m.values()].sort((p, q) => Date.parse(p.t) - Date.parse(q.t)); };
  /** الشموع اليومية تتغير مرة واحدة باليوم: نحفظ القديم في الجهاز ونجلب آخر 8 أيام فقط (أسرع بكثير). */
  async function dailyFor(sym) {

    const base = c && c.bars && c.bars.length > 200 ? c.bars : [];
    const full = !base.length || now() - Date.parse(base[base.length - 1].t) > 6 * 86400000;
    const j = await API.bars([sym], "1Day", isoDaysAgo(full ? 430 : 8));

      const idx = Store.get("d_index", []).filter((x) => x !== sym); idx.push(sym);

      Store.set("d_index", idx);

  async function loadSymbol(sym, force) {

    if (st[sym] && !force && now() - st[sym] < 15000) return;
    fl[sym] = (async () => {
      try {
        const mP = API.bars([sym], "1Min", isoDaysAgo(9)), dP = dailyFor(sym);
        dP.catch(() => {});
        const m = await mP;
        S.bars1m[sym] = mergeBars(S.bars1m[sym] || [], (m[sym] || []).map(C.toBar));
        if (!S.daily[sym]) S.daily[sym] = [];
        refresh(sym); throttle("ui", 30, renderLive);
        const d = await dP;
        S.daily[sym] = d.map(C.toDaily); st[sym] = now();
        refresh(sym); throttle("ui", 30, renderLive);
      } finally { delete fl[sym]; }
    })();
    return fl[sym];
  }
  function refresh(sym) {
    const m = S.bars1m[sym], d = S.daily[sym];
    if (!m || !m.length || !d) return null;
    const A = C.analyzeAll(m, d, now());
    S.analysis[sym] = A;
    detectAlerts(sym, A);
    return A;
  }
  const lastPrice = (sym) => (S.trade[sym] ? S.trade[sym].p : S.analysis[sym] ? S.analysis[sym].bars1m.slice(-1)[0].c : null);
  function prevClose(sym) {
    const d = S.daily[sym];
    if (!d || !d.length) return null;
    const ny = C.nyParts(now());
    return d[d.length - 1].d === ny.d && d.length > 1 ? d[d.length - 2].c : d[d.length - 1].c;
  }
  const chgPct = (sym) => { const p = lastPrice(sym), pc = prevClose(sym); return p && pc ? (p / pc - 1) * 100 : null; };

  // ---------------------------------------------------------------- البث اللحظي
  let ws = null, wsTimer = null, wsDelay = 1000, subs = new Set();
  function wantSyms() { return [...new Set([...S.watch, S.open].filter((x) => x && SYM_RE.test(x)))].slice(0, 30); }
  function wsConnect() {
    if (!S.key || !S.secret) return;
    if (ws) { const old = ws; old.onclose = old.onmessage = old.onerror = null; try { old.close(); } catch (e) { /* ignore */ } }
    S.ws.state = "connecting"; renderStatus();
    const sock = ws = new WebSocket("wss://stream.data.alpaca.markets/v2/iex");
    sock.onmessage = (ev) => {
      if (sock !== ws) return;
      let msgs; try { msgs = JSON.parse(ev.data); } catch (e) { return; }
      S.ws.lastMsg = Date.now();
      for (const m of msgs) {
        if (m.T === "success" && m.msg === "connected") sock.send(JSON.stringify({ action: "auth", key: S.key, secret: S.secret }));
        else if (m.T === "success" && m.msg === "authenticated") { S.ws.state = "live"; wsDelay = 1000; subs = new Set(); wsSync(); fillGaps(); }
        else if (m.T === "error") { S.ws.state = "error:" + (m.msg || m.code); }
        else if (m.T === "t") onTrade(m);
        else if (m.T === "b" || m.T === "u") onBar(m);

  }
  function wsSync() {

    const add = [...want].filter((s) => !subs.has(s)), del = [...subs].filter((s) => !want.has(s));
    if (add.length) ws.send(JSON.stringify({ action: "subscribe", trades: add, bars: add }));
    if (del.length) ws.send(JSON.stringify({ action: "unsubscribe", trades: del, bars: del }));

  }
  function onTrade(m) {
    S.ws.ticks++;
    const t = Date.parse(m.t);
    S.ws.lastTrade = t;
    const lag = Math.max(0, (now() - t) / 1000);
    S.ws.lag = S.ws.lag === null ? lag : S.ws.lag * 0.8 + lag * 0.2;
    S.trade[m.S] = { p: m.p, s: m.s, t };
    const q = C.nyParts(t);
    if (q.m >= 570 && q.m <= 959) {
      const k = Math.floor(t / 60000), L = S.live[m.S];
      if (!L || L.k !== k) S.live[m.S] = { k, o: m.p, h: m.p, l: m.p, c: m.p, v: m.s || 0 };
      else { L.h = Math.max(L.h, m.p); L.l = Math.min(L.l, m.p); L.c = m.p; L.v += m.s || 0; }

  /** الشمعة الحية للإطار الحالي: دقائق مكتملة من البث + الدقيقة الجارية من الصفقات. لا تدخل في التحليل. */
  function formingBar(sym, tf) {
    if (tf === "1Day" || !marketState().open) return null;

    const bucket = 570 + Math.floor((ny.m - 570) / N) * N;
    const curMin = Math.floor(nowMs / 60000) * 60000, bt = curMin - (ny.m - bucket) * 60000;

    const seq = parts.concat(cur ? [cur] : []);

    const tr = S.trade[sym];

  /** بعد انقطاع الاتصال: نعيد تحميل شموع الدقيقة لسد الفجوة، ونعرض مقدار النقص. */

      if (gapMin > 3) {

  }

  function pushAlert(sym, type, tf, indicator, why, barT, price) {

  }
  function sendNtfy(a) {
    const body = `${a.sym} ${num(a.price)} | ${a.tf} | ${a.indicator}\n${a.why}\n${new Date(a.time).toLocaleTimeString("ar-SA")}\nقراءة فقط. القرار قرارك.`;

  }
  /** يقارن الحالة الحالية بالسابقة ولا يرسل إلا عند التحول (لا تكرار لنفس الحالة). */
  function detectAlerts(sym, A) {
    const r5 = A.results["5Min"], r1 = A.results["1Min"];
    if (!r5) return;
    const F = r5.facts, p = lastPrice(sym) || F.price, tfT = r5.last.t;
    const P = S.prev[sym] || {};
    const cur = {
      aboveVwap: F.vwap ? F.price > F.vwap : null, e9over20: F.ema9 !== null && F.ema20 !== null ? F.ema9 > F.ema20 : null,
      macdPos: F.hist !== null ? F.hist > 0 : null, rsiZone: F.rsi === null ? null : F.rsi < S.cfgAlerts.rsiLow ? "low" : F.rsi > S.cfgAlerts.rsiHigh ? "high" : "mid",
      div: F.div, rvolHi: F.rvol !== null && F.rvol >= S.cfgAlerts.rvolSpike,
    };

    const flip = (k) => !first && P[k] !== null && P[k] !== undefined && cur[k] !== null && cur[k] !== P[k];
    if (flip("aboveVwap")) pushAlert(sym, "vwap", "5Min", "VWAP", cur.aboveVwap ? "السعر استعاد VWAP وأغلق فوقه" : "السعر فقد VWAP وأغلق تحته (ضغط بيعي محتمل)", tfT, p);

  function pickTf(A) {
    if (!A || A.results[S.tf]) return;
    const order = ["5Min", "15Min", "3Min", "30Min", "1Hour", "1Day", "1Min"];
    const t = order.find((x) => A.results[x]) || order.find((x) => (A.frames[x] || []).length);
    if (t) S.tf = t;
  }
  function chartData(sym) {
    const A = S.analysis[sym]; if (!A || !A.frames[S.tf]) return null;
    const ok = S.ws.state === "live" && marketState().open;
    return { sym, tf: S.tf, bars: A.frames[S.tf], forming: formingBar(sym, S.tf), levels: A.levels, inval: lastR ? lastR.invalidation.px : null, intraday: S.tf !== "1Day",
      price: lastPrice(sym), chg: chgPct(sym), live: { ok, label: S.ws.state === "live" ? "CLOSED" : "OFF", lag: S.ws.lag } };
  }
  function chartLive() {
    if (!CH || !S.open) return;
    const d = chartData(S.open); if (!d) return;
    CH.setData(d); updateHead(); renderSide();
  }

  /** تكبير الشارت لكامل الشاشة مع لوحة أرقام جانبية. */
  function setFs(on) {
    S.fs = !!on;
    const el = $("#cfs"), b = $("#fsbtn"); if (!el) return;
    el.classList.toggle("fs", S.fs); document.body.classList.toggle("nofs", S.fs);
    if (b) b.textContent = S.fs ? "✕ إغلاق" : "⛶ تكبير";
    if (CH) { CH.draw(); renderSide(); }
    if (typeof window.scrollTo === "function" && !S.fs) { try { el.scrollIntoView({ block: "nearest" }); } catch (e) { /* */ } }
  }
  function renderSide() {
    const el = $("#side"); if (!el || !CH || !S.open) return;
    const sn = CH.snapshot(); if (!sn) return;
    const p = lastPrice(S.open), c = chgPct(S.open), A = S.analysis[S.open], lv = (A && A.levels) || {}, b = sn.b, up = b.c >= b.o;
    const row = (k, v, cl) => `<div class="r"><span>${k}</span><b class="${cl || ""}">${v === null || v === undefined || (typeof v === "number" && Number.isNaN(v)) ? "—" : typeof v === "number" ? num(v) : v}</b></div>`;
    const vol = b.v >= 1e6 ? (b.v / 1e6).toFixed(2) + "M" : b.v >= 1e3 ? (b.v / 1e3).toFixed(1) + "K" : String(b.v);
    const lag = S.ws.lag;
    const html = `<div class="sym">${esc(S.open)}<small>${esc(TF_LABEL[S.tf] || S.tf)}</small></div>
      <div class="p ${cls(c)}">${num(p)}</div><div class="${cls(c)} chgl">${pct(c)}</div>
      <div class="sec">${sn.cursor ? "الشمعة المحددة" : sn.forming ? "الشمعة الحية" : "آخر شمعة"}<small>${esc(sn.t)}</small></div>
      ${row("فتح", b.o)}${row("أعلى", b.h)}${row("أدنى", b.l)}${row("إغلاق", b.c, up ? "up" : "dn")}${row("حجم", vol)}
      <div class="sec">المؤشرات</div>
      ${sn.vw !== null ? row("VWAP", sn.vw) : ""}${row("EMA9", sn.e9)}${row("EMA20", sn.e20)}${row("EMA50", sn.e50)}${sn.s200 !== null ? row("SMA200", sn.s200) : ""}${row("RSI", sn.rsi === null ? null : sn.rsi.toFixed(0))}${row("MACD hist", sn.hist === null ? null : sn.hist.toFixed(4))}
      <div class="sec">مستويات</div>
      ${lv.HOD !== undefined ? row("HOD", lv.HOD) + row("LOD", lv.LOD) : ""}${lv.PDH !== undefined ? row("PDH", lv.PDH) + row("PDL", lv.PDL) : ""}${sn.res !== null ? row("مقاومة", sn.res) : ""}${sn.sup !== null ? row("دعم", sn.sup) : ""}${lastR && lastR.invalidation ? row("INV", lastR.invalidation.px) : ""}
      <div class="sec">البث</div>${row("التأخر", lag === null || lag === undefined ? null : (lag < 10 ? lag.toFixed(1) : Math.round(lag)) + "ث")}`;
    if (el._k !== html) { el._k = html; el.innerHTML = html; }
  }
  function showPick(x) {
    const el = $("#pick"); if (!el) return;
    if (!x) { el.hidden = true; el.innerHTML = ""; return; }
    const sec = (t, v) => (v ? `<h5>${t}</h5><p>${esc(v)}</p>` : "");
    el.innerHTML = `<button class="x" id="pickx" aria-label="إغلاق">✕</button><div class="pt"><b>${esc(x.title)}</b> <span class="tagp ${x.dir > 0 ? "up" : x.dir < 0 ? "dn" : ""}">${esc(x.tag)}</span></div>
      <div class="pr">${x.rows.map(([k, v]) => `<div><span>${esc(k)}</span><b dir="auto">${esc(v)}</b></div>`).join("")}</div>
      ${sec("ماذا يعني؟", x.meaning)}${sec("كيف تظهر؟", x.how)}${sec("ما الذي يقويها أو يضعفها؟", x.watch)}${sec("انتبه", x.caution)}<p class="note">${esc(x.note)}</p>`;
    el.hidden = false; el.scrollTop = 0;
    $("#pickx").onclick = () => { el.hidden = true; if (CH) CH.clearPick(); };
  }
  function freshText() {
    const A = S.analysis[S.open]; if (!A) return "";
    const m1 = A.bars1m, last = m1.length ? m1[m1.length - 1].t : null, age = last ? (now() - last) / 1000 : null, open = marketState().open;
    return age === null ? "لا بيانات" : open ? (age < 150 ? `لحظية (IEX) — آخر شمعة مكتملة قبل ${fmtAge(age)}` : `⚠ متأخرة — آخر شمعة مكتملة قبل ${fmtAge(age)}`) : `السوق مغلق — آخر شمعة قبل ${fmtAge(age)}`;
  }
  function updateHead() {
    const p = lastPrice(S.open), c = chgPct(S.open), hp = $("#hp"), hc = $("#hc"), fr = $("#fresh");
    if (hp) { hp.textContent = num(p); hp.className = "big2 " + cls(c); }
    if (hc) { hc.innerHTML = pct(c); hc.className = cls(c); }
    if (fr) fr.textContent = freshText();
  }
  function renderSigs(list, d) {
    const el = $("#asig"); if (!el) return;
    el.innerHTML = `<b>الإشارات المرسومة على الشارت (آخر ${list.length})</b><ol>` + (list.length ? list.slice().reverse().map((g) => `<li><span class="num ${g.dir > 0 ? "up" : g.dir < 0 ? "dn" : "mid"}">${g.num}</span><div><b>${esc(g.text)}</b><div class="note">${esc(Chart.timeLabel(g, d.intraday))} (نيويورك) · سعر الإغلاق ${num(g.price)}</div></div></li>`).join("") : "<li>لا إشارات في هذه الفترة.</li>")
      + `</ol><p class="note">علامات وصفية لأحداث وقعت فعلًا على شموع مكتملة. ليست توصية، ولا تعني أن السعر سيتحرك بنفس الاتجاه.</p>`;
  }
  function renderAnalysisBox() {
    const box = $("#abox"); if (!box || !S.open) return;
    const A = S.analysis[S.open];
    if (!A) { box.innerHTML = '<p class="empty">لا توجد بيانات كافية.</p>'; skey = ""; return; }
    const r = A.results[S.tf], frame = A.frames[S.tf] || [];
    if (!r && !frame.length) {
      box.innerHTML = `<p class="empty">لا توجد شموع مكتملة في إطار ${S.tf}. السهم قليل التداول على IEX. جرّب إطارًا آخر.</p><div class="ctool"><div class="seg" id="atfs">${C.TFS.map((t) => `<button data-tf="${t}" class="${t === S.tf ? "on" : ""}">${TF_LABEL[t]}</button>`).join("")}</div></div>`;
      $$("#atfs button").forEach((b) => (b.onclick = () => { S.tf = b.dataset.tf; skey = ""; renderAnalysisBox(); }));
      skey = ""; return;
    }
    const sk = S.open + "|" + S.tf;
    if (skey !== sk || !$("#chart")) {
      box.innerHTML = `<div class="head" id="ahead"></div>
        <div id="cfs"><div class="ctool"><div class="seg" id="atfs">${C.TFS.map((t) => `<button data-tf="${t}" class="${t === S.tf ? "on" : ""}">${TF_LABEL[t]}</button>`).join("")}</div>
          <div class="seg" id="azoom"><button data-z="0.8" aria-label="تقريب">＋</button><button data-z="1.25" aria-label="إبعاد">－</button><button data-z="r" aria-label="إعادة">⟲</button></div>
          <button id="fsbtn" class="fsb">⛶ تكبير</button></div>
        <div class="ctool tgrow"><div class="tg" id="atg">${TGL.map(([k, t]) => `<button data-k="${k}">${t}</button>`).join("")}</div></div>
        <div class="fsrow"><div class="chartwrap"><canvas id="chart"></canvas><div id="pick" hidden></div></div><aside id="side"></aside></div></div>
        <p class="note tiphint">اضغط على أي ▲▼ أو خط أو مؤشر داخل الشارت ليظهر شرحه.</p>
        <div class="legend"><span>R مقاومة</span><span>S دعم</span><span>INV مستوى إبطال القراءة</span><span>HOD/LOD أعلى/أدنى اليوم</span><span>PDH/PDL أعلى/أدنى أمس</span><span>PMH/PML ما قبل السوق</span><span>ORH/ORL النطاق الافتتاحي</span><span>▲▼ حدث فني مرقّم</span><span>الشمعة المتقطعة = حية، ولا تدخل في التحليل حتى تكتمل</span></div>
        <div class="sigs" id="asig"></div><div id="adyn"></div>`;
      CH = Chart.create($("#chart"), { show: Store.get("chartShow", {}), onShow: (v) => Store.set("chartShow", v), onSignals: renderSigs, onPick: showPick, onFrame: renderSide });
      $("#fsbtn").onclick = () => setFs(!S.fs); setFs(!!S.fs);
      const sync = () => $$("#atg button").forEach((b) => b.classList.toggle("on", !!CH.state.show[b.dataset.k]));
      sync();
      $$("#atg button").forEach((b) => (b.onclick = () => { CH.toggle(b.dataset.k); sync(); }));
      $$("#azoom button").forEach((b) => (b.onclick = () => (b.dataset.z === "r" ? CH.reset() : CH.zoom(parseFloat(b.dataset.z)))));
      $$("#atfs button").forEach((b) => (b.onclick = () => { S.tf = b.dataset.tf; skey = ""; renderAnalysisBox(); }));
      skey = sk; dynKey = "";
    }
    const lv = A.levels, dk = r ? `${r.last.t}|${r.score}|${A.bars1m.length}|${lv.HOD}|${lv.LOD}` : `limited|${frame.length}|${A.bars1m.length}`;
    if (dk !== dynKey) { dynKey = dk; if (r) fillDynamic(A, r); else fillLimited(A, frame); }
    chartLive();
  }
  /** شموع أقل من 30: نعرض الشارت فقط، بلا درجة ولا قراءة (لا نخترع تحليلًا من بيانات قليلة). */
  function fillLimited(A, frame) {
    lastR = null;
    const p = lastPrice(S.open), c = chgPct(S.open);
    $("#ahead").innerHTML = `<div><b class="big2">${esc(S.open)}</b> <span id="hp" class="big2 ${cls(c)}">${num(p)}</span> <span id="hc" class="${cls(c)}">${pct(c)}</span></div>`;
    $("#adyn").innerHTML = `<div class="warnbox"><b>⚠ بيانات قليلة: ${frame.length} شمعة مكتملة فقط في إطار ${esc(S.tf)}</b><p class="note" style="margin:6px 0">السهم قليل التداول على IEX (يظهر هذا في الوارنت والأسهم الضعيفة السيولة)، لذلك لا يمكن حساب الدرجة والقراءة (يلزم 30 شمعة مكتملة على الأقل). الشارت يعرض الشموع المتوفرة فقط. جرّب إطارًا أكبر مثل 15د أو يومي.</p></div>
      <p class="note">البيانات: <span id="fresh">${esc(freshText())}</span> · المصدر IEX · حجم جزئي</p><p class="note">${esc(C.DISC)}</p>`;
  }
  function fillDynamic(A, r) {
    const meta = { fresh: freshText() };
    const R = C.report(S.open, A.results, S.tf, A.frames[S.tf], A.levels, meta); lastR = R;
    const F = R.facts, p = lastPrice(S.open), c = chgPct(S.open);
    const li = (a) => (a.length ? a.map((x) => `<li>${esc(x)}</li>`).join("") : "<li>—</li>");
    $("#ahead").innerHTML = `<div><b class="big2">${esc(S.open)}</b> <span id="hp" class="big2 ${cls(c)}">${num(p)}</span> <span id="hc" class="${cls(c)}">${pct(c)}</span></div>
      <div class="gauge"><div class="gfill ${R.score >= 60 ? "up" : R.score <= 40 ? "dn" : "mid"}" style="width:${R.score}%"></div></div>
      <div><b>${Math.round(R.score)}/100</b> — ${esc(R.category)} <span class="note">(على إطار ${esc(S.tf)} فقط)</span></div>`;
    $("#adyn").innerHTML = `<h3>الحقائق (من البيانات)</h3>
      <div class="grid">${[["RVOL", F.rvol ? F.rvol.toFixed(1) + "×" : "—"], ["RSI", F.rsi ? F.rsi.toFixed(0) : "—"], ["MACD", num(F.macd, 3)], ["إشارة", num(F.signal, 3)], ["هيستوغرام", num(F.hist, 3)], ["EMA9", num(F.ema9)], ["EMA20", num(F.ema20)], ["EMA50", num(F.ema50)], ["SMA200", num(F.sma200)], ["VWAP", num(F.vwap)], ["ATR", `${num(F.atr)} (${F.atr_pct ? F.atr_pct.toFixed(1) : "—"}%)`], ["شموع محللة", r.bars]].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>
      <div class="levels">${Object.entries(R.levels).filter(([k]) => R.levelNames[k]).map(([k, v]) => `<span class="chip">${R.levelNames[k]} ${num(v)}</span>`).join("")}</div>
      <h3>القراءة التفسيرية</h3><p class="read">${esc(R.reading)}</p>
      <div class="cols2"><div><h4>✅ إيجابي</h4><ul>${li(R.positives)}</ul></div><div><h4>❌ سلبي</h4><ul>${li(R.negatives)}</ul></div></div>
      ${R.conflicts.length ? `<div class="warnbox"><b>⚠ تعارض المؤشرات</b><ul>${li(R.conflicts)}</ul></div>` : ""}
      <h3>مقارنة الأطر الزمنية</h3><div class="mtf">${C.TFS.map((t) => { const x = A.results[t]; return `<div class="${x ? (x.score >= 60 ? "up" : x.score <= 40 ? "dn" : "mid") : "na"}"><b>${t}</b><span>${x ? Math.round(x.score) : "—"}</span></div>`; }).join("")}</div>
      <pre class="cmp">${esc(R.compare.text)}</pre>
      <h3>السيناريوهات</h3><p>🟢 <b>الإيجابي:</b> ${esc(R.scenarioUp)}</p><p>🔴 <b>السلبي:</b> ${esc(R.scenarioDown)}</p>
      <p class="inval">⛔ <b>مستوى إبطال القراءة:</b> ${esc(R.invalidation.text)}</p>
      ${R.risks.length ? `<div class="warnbox"><b>⚠ مخاطر</b><ul>${li(R.risks)}</ul></div>` : ""}
      <p class="note">البيانات: <span id="fresh">${esc(meta.fresh)}</span> · المصدر IEX · آخر شمعة مكتملة ${new Date(r.last.t).toLocaleString("ar-SA", { timeZone: "America/New_York" })} (نيويورك)</p>
      <p class="note">${esc(R.disclaimer)}</p>`;
  }
  function alertsUI(el) {
    const mine = S.alerts;
    el.innerHTML = `<div class="bar"><button id="aclr">مسح الكل</button><label class="inl"><input type="checkbox" id="asound" ${S.cfgAlerts.sound ? "checked" : ""}> اهتزاز</label></div>` +
      (mine.length ? mine.map((a) => { const s = staleness(a); return `<div class="alert ${s.stale ? "stale" : ""}"><div><b>${symLink(a.sym)}</b> ${num(a.price)} · ${a.tf} · <span class="chip">${esc(a.indicator)}</span></div><div>${esc(a.why)}</div>
        <div class="note">${new Date(a.time).toLocaleTimeString("ar-SA", { timeZone: "America/New_York" })} (نيويورك) · عمرها ${fmtAge(s.age)}${s.moved !== null ? ` · السعر الآن ${num(lastPrice(a.sym))} (${pct(s.moved)} منذ الإشارة)` : ""}${s.stale ? ' · <b class="warnt">⚠ قديمة: أعد القراءة قبل أي قرار</b>' : ""}</div></div>`; }).join("") : '<p class="empty">لا توجد تنبيهات بعد. تُرسل عند تحول الحالة فقط (لا تكرار).</p>');
    $("#aclr").onclick = () => { S.alerts = []; render(); };
    $("#asound").onchange = (e) => { S.cfgAlerts.sound = e.target.checked; Store.set("cfgAlerts", S.cfgAlerts); };
    bindOpen();
  }
  function renderLive() {
    renderStatus();
    if (S.tab === "watch") renderWatchList();
    else if (S.tab === "analysis") renderAnalysisBox();
    else if (S.tab === "overview") overviewUI($("#body"));
    else if (S.tab === "alerts") alertsUI($("#body"));
  }
  function render() { renderTabs(); renderStatus(); renderBody(); }

  // ---------------------------------------------------------------- الإعدادات
  function settings() {
    const d = $("#settings");
    d.innerHTML = `<div class="sheet"><h3>الإعدادات</h3>
      <p class="warnt">استخدم مفاتيح بيانات أو حساب تجريبي (Paper) فقط. المفاتيح تُحفظ في هذا الجهاز ولا تُرسل لأي جهة إلا Alpaca.</p>
      <label>Alpaca Key ID<input id="sk" value="${esc(S.key)}" autocomplete="off"></label><label>Alpaca Secret<input id="ss" type="password" value="${esc(S.secret)}" autocomplete="off"></label>
      <label>موضوع ntfy (اختياري: يرسل تنبيهات الصفحة لجوالك)<input id="sn" value="${esc(S.ntfy)}"></label>
      <label>Finnhub Key (اختياري: للقيمة السوقية)<input id="sf" value="${esc(S.finnhub)}"></label>
      <div class="bar"><button id="ssave">حفظ</button><button id="sclose">إغلاق</button></div></div>`;
    d.hidden = false;
    $("#sclose").onclick = () => (d.hidden = true);
    $("#ssave").onclick = () => { S.key = $("#sk").value.trim(); S.secret = $("#ss").value.trim(); S.ntfy = $("#sn").value.trim(); S.finnhub = $("#sf").value.trim(); ["key", "secret", "ntfy", "finnhub"].forEach((k) => Store.set(k, S[k])); d.hidden = true; start(); };
  }
  function start() { render(); if (S.key && S.secret) { wsDelay = 1000; wsConnect(); S.watch.forEach((s) => loadSymbol(s).catch(() => {})); } }
  function init() {
    $("#gear").onclick = settings;
    setInterval(() => { renderStatus(); if (S.tab === "alerts") alertsUI($("#body")); if (S.tab === "analysis") updateHead(); }, 3000);
    setInterval(wsSync, 5000);
    start();
  }
  window.FT = { get CH() { return CH; }, S, API, init, detectAlerts, staleness, passFilters, mergeBars, pushAlert, formingBar, onTrade };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

</script>
</body>
</html>
